<script>
(function () {
  function usable(name) {
    try {
      var s = window[name];
      if (!s) return false;
      s.setItem('__probe__', '1');
      s.removeItem('__probe__');
      return true;
    } catch (e) { return false; }
  }
  function memoryStorage() {
    var data = {};
    var api = {
      getItem: function (k) {
        k = String(k);
        return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null;
      },
      setItem: function (k, v) { data[String(k)] = String(v); },
      removeItem: function (k) { delete data[String(k)]; },
      clear: function () { data = {}; },
      key: function (i) {
        var ks = Object.keys(data);
        return (i >= 0 && i < ks.length) ? ks[i] : null;
      }
    };
    try {
      Object.defineProperty(api, 'length', {
        get: function () { return Object.keys(data).length; }
      });
    } catch (e) {}
    return api;
  }
  window.__storagePatched = {};
  ['localStorage', 'sessionStorage'].forEach(function (name) {
    if (usable(name)) {
      window.__storagePatched[name] = false;
      return;
    }
    var shim = memoryStorage();
    try {
      Object.defineProperty(window, name, { value: shim, configurable: true });
    } catch (e) {
      try { window[name] = shim; } catch (e2) {}
    }
    window.__storagePatched[name] = true;
  });
})();
</script>
<title>量子星河 QuantXY · AI 企业工作台</title>
<style>
:root{
  --bg:#f3f5fa; --card:#fff; --line:#e9edf5; --line2:#f1f4fa;
  --ink:#1b2440; --sub:#5b6785; --mut:#7d879f;
  --brand:#2563eb; --brand-d:#1d4ed8; --brand-s:#eef3ff; --brand-s2:#e2ebff;
  --violet:#7c3aed; --violet-s:#f3eeff;
  --ok:#10b981; --ok-s:#e8f9f2; --warn:#f59e0b; --warn-s:#fff4e2; --risk:#ef4444; --risk-s:#fdecec;
  --sky:#38bdf8; --pink:#ec4899;
  --r:14px; --r2:10px;
  --sh:0 1px 2px rgba(20,30,60,.04), 0 10px 26px rgba(20,30,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d7deec;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;outline:none}
a{color:inherit;text-decoration:none}
.app{display:flex;min-height:100vh}
.app.auth-hidden{display:none}

/* ---------- demo login ---------- */
.login-gate{min-height:100vh;padding:32px;display:grid;place-items:center;background:
  radial-gradient(circle at 20% 12%,rgba(37,99,235,.10),transparent 30%),
  radial-gradient(circle at 88% 88%,rgba(124,58,237,.07),transparent 28%),var(--bg)}
.login-gate[hidden]{display:none}
.login-card{width:min(100%,420px);background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:34px 36px 30px;box-shadow:0 22px 60px rgba(20,30,60,.12)}
.login-brand{text-align:center;margin-bottom:24px}
.login-brand svg{display:block;margin:0 auto 8px}
.login-brand .wm{font-size:22px;line-height:1;letter-spacing:2.5px;font-weight:500;color:#0d1b3c}
.login-brand .wm .x{background:linear-gradient(48deg,#0d1b3c 47%,#2f6bff 53%);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-brand h1{font-size:20px;margin:21px 0 5px;letter-spacing:.2px}
.login-brand p{font-size:12.5px;color:var(--mut);margin:0}
.login-field{display:block;margin-top:16px}
.login-field>span{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-bottom:7px}
.login-input{display:flex;align-items:center;gap:8px;border:1px solid #dbe2ef;border-radius:11px;background:#fff;
  padding:0 12px;transition:.15s}
.login-input:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.login-input input{border:0;background:transparent;width:100%;height:44px;min-width:0;font-size:13.5px}
.login-toggle{flex:0 0 auto;color:var(--brand);font-size:12px;padding:7px 2px}
.login-options{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0 0}
.login-remember{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:12.5px;cursor:pointer}
.login-remember input{width:15px;height:15px;accent-color:var(--brand)}
.login-error{min-height:22px;padding-top:8px;color:var(--risk);font-size:12px}
.login-submit{width:100%;height:44px;justify-content:center;font-size:14px;font-weight:600;box-shadow:0 10px 22px rgba(37,99,235,.25)}
.login-note{margin:18px 0 0;padding:11px 12px;border-radius:10px;background:var(--brand-s);color:var(--sub);
  font-size:11.5px;line-height:1.65;text-align:center}
.login-note b{color:var(--brand-d)}

/* ---------- sidebar ---------- */
.side{width:236px;flex:0 0 236px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 18px 2px;text-align:center}
.brand svg{display:block;margin:0 auto}
.brand .wm{font-size:21px;line-height:1;letter-spacing:2.5px;font-weight:500;color:#0d1b3c;margin-top:4px}
.brand .wm .x{background:linear-gradient(48deg,#0d1b3c 47%,#2f6bff 53%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .cn{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10px;letter-spacing:4px;color:#26385e}
.brand .cn i{flex:1;height:1px;background:#d5dded}
.side h6{margin:14px 20px 12px;font-size:11.5px;color:var(--mut);font-weight:500;text-align:center;letter-spacing:2px}
.hint{margin:6px 0 0;font-size:11.5px;color:var(--mut);line-height:1.6}
.req::after{content:' *';color:var(--risk)}
.drop{border:1.5px dashed #cfd9ec;border-radius:12px;padding:24px;text-align:center;background:#fbfcfe;cursor:pointer;transition:.15s}
.drop:hover,.drop.on{border-color:var(--brand);background:var(--brand-s)}
.fchip{padding:6px 12px;border-radius:20px;font-size:12.5px;background:#f4f6fb;color:var(--sub);border:1px solid transparent}
.fchip.on{background:var(--brand-s);color:var(--brand-d);border-color:#c9dcff}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mask{position:fixed;inset:0;background:rgba(16,24,44,.42);display:grid;place-items:center;z-index:90;animation:fade .18s ease both}
.modal{background:#fff;border-radius:16px;padding:22px;width:400px;max-width:92vw;box-shadow:0 24px 60px rgba(16,24,44,.28)}
.code{background:#0d1b3c;color:#cfe0ff;border-radius:11px;padding:14px;font-size:11.5px;line-height:1.65;
  overflow:auto;max-height:300px;white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.step{display:flex;gap:10px;padding:8px 0;font-size:12.5px;color:var(--sub);line-height:1.7}
.step b{flex:0 0 20px;height:20px;border-radius:50%;background:var(--brand-s);color:var(--brand-d);
  display:grid;place-items:center;font-size:11px}
.filerow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-top:9px;background:#fff}
.nav{flex:1;overflow:auto;padding:0 12px 10px;display:flex;flex-direction:column}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;
  color:var(--sub);font-size:13.5px;margin-bottom:2px;transition:.15s;order:var(--nav-order,0)}
.nav button:hover{background:var(--brand-s);color:var(--brand-d)}
.nav button.on{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.nav svg{flex:0 0 18px}
.nav .mobile-more{display:none}
.nav .mobile-more-panel{display:contents}
.mobile-nav-label{display:none}
.helper{margin:12px;padding:14px;border-radius:var(--r);background:linear-gradient(160deg,#eef3ff,#e7ecff);position:relative}
.helper .x{position:absolute;right:8px;top:6px;color:var(--mut);font-size:15px}
.helper .row{display:flex;gap:10px;align-items:flex-start}
.helper b{font-size:13px;display:block}
.helper p{margin:2px 0 0;font-size:11.5px;color:var(--sub);line-height:1.5}
.helper button.cta{margin-top:11px;width:100%;background:var(--brand);color:#fff;padding:8px;border-radius:9px;font-size:12.5px;
  display:flex;justify-content:center;gap:6px;align-items:center}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:16px 26px;background:var(--bg);position:sticky;top:0;z-index:20}
.top .ttl{min-width:0;max-width:100%}
.top .ttl h1{margin:0;font-size:21px;letter-spacing:.3px;white-space:nowrap;word-break:keep-all;overflow:hidden;text-overflow:ellipsis}
.top .ttl p{margin:3px 0 0;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;width:340px;color:var(--mut)}
.search input{border:0;background:none;width:100%;font-size:13px}
.pill{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--sub);white-space:nowrap}
.bell{position:relative;width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.bell i{position:absolute;top:-6px;right:-6px;background:var(--risk);color:#fff;font-size:10px;font-style:normal;
  min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.top-tool{position:relative;display:flex;align-items:center}
.top-popover{right:0;top:46px;width:290px;max-height:360px}
.top-popover .notice{align-items:flex-start;padding:10px 9px}
.top-popover .notice b{display:block;font-size:12.5px;text-align:left}
.top-popover .notice span{display:block;font-size:11px;color:var(--mut);margin-top:3px;text-align:left}
.top-popover .empty{padding:18px 10px;font-size:12px}
.btn{background:var(--brand);color:#fff;padding:10px 15px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:7px;
  box-shadow:0 8px 18px rgba(37,99,235,.25)}
.btn.ghost{background:#fff;color:var(--sub);border:1px solid var(--line);box-shadow:none}
.btn.soft{background:var(--brand-s);color:var(--brand-d);box-shadow:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.quick-create .btn{white-space:nowrap}
.me{display:flex;align-items:center;gap:9px;position:relative}
.me>button{white-space:nowrap;flex:0 0 auto}
.me .nm,.me .rl{display:block;white-space:nowrap}
.me .nm{font-size:13px;font-weight:600;line-height:1.2}
.me .rl{font-size:11px;color:var(--mut)}
.menu{position:absolute;right:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);
  padding:6px;width:230px;z-index:40;max-height:340px;overflow:auto}
.menu button{display:flex;gap:9px;align-items:center;width:100%;padding:8px 9px;border-radius:8px;font-size:13px}
.menu button:hover{background:var(--brand-s)}
.menu .hd{font-size:11px;color:var(--mut);padding:7px 9px 4px}
.menu .sep{height:1px;background:var(--line);margin:6px 4px}
.menu button.logout{color:var(--risk);justify-content:center}
.menu button.logout:hover{background:var(--risk-s)}
.view{padding:0 26px 30px;flex:1}

/* ---------- primitives ---------- */
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .hd{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card .hd h3{margin:0;font-size:15px}
.card .hd .sm{font-size:12px;color:var(--mut)}
.card .bd{padding:16px 18px}
.link{font-size:12.5px;color:var(--brand);display:inline-flex;align-items:center;gap:3px}
.kpi{padding:15px 16px}
.kpi .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kpi .t span{font-size:12.5px;color:var(--sub)}
.kpi .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 32px}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.5px;margin:9px 0 6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;margin-left:2px}
.kpi .f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .f em{font-style:normal;font-size:11.5px;color:var(--mut)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2.5px 8px;border-radius:20px;white-space:nowrap;font-weight:500}
.t-b{background:var(--brand-s);color:var(--brand-d)} .t-v{background:var(--violet-s);color:var(--violet)}
.t-g{background:var(--ok-s);color:#0b8f6a} .t-o{background:var(--warn-s);color:#b26a00}
.t-r{background:var(--risk-s);color:#c62828} .t-n{background:#f1f4fa;color:var(--sub)}
.up{color:var(--ok);font-size:11.5px;font-weight:600} .dn{color:var(--risk);font-size:11.5px;font-weight:600}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;flex:0 0 26px;font-weight:600}
.av.lg{width:34px;height:34px;flex:0 0 34px;font-size:12.5px}
.bar{height:6px;border-radius:6px;background:#eef1f8;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--brand)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line2)}
td{padding:11px 10px;font-size:13px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line2);padding:0 18px}
.tabs button{padding:11px 0 10px;font-size:13.5px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:20px;font-size:12.5px;background:#f4f6fb;color:var(--sub)}
.chip.on{background:var(--brand);color:#fff}
.field{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px}
.inp,.ta,.sel{width:100%;border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;font-size:13px;background:#fbfcfe}
.ta{min-height:92px;resize:vertical;line-height:1.6}
.inp:focus,.ta:focus,.sel:focus{border-color:var(--brand);background:#fff}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-size:13px}
.sk{background:linear-gradient(90deg,#eef1f8,#f7f9fd,#eef1f8);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px}
@keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:#1b2440;color:#fff;padding:11px 18px;
  border-radius:11px;font-size:13px;opacity:0;transition:.3s;z-index:99;box-shadow:0 12px 30px rgba(20,30,60,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1100px){
  .top{flex-wrap:wrap}
  .top .ttl{flex:1 1 180px}
  .top .search{width:min(100%,300px)}
}

/* ---------- scheduling centre ---------- */
.wbs{font-size:13px}
.wbs .ph{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;background:#f7f9fd;margin-bottom:6px;font-weight:600}
.wbs .tk{display:flex;align-items:center;gap:9px;padding:7px 10px 7px 30px;border-radius:9px;color:var(--sub)}
.wbs .tk:hover{background:var(--brand-s);color:var(--brand-d)}
.wbs .tk.on{background:var(--brand-s2);color:var(--brand-d);font-weight:600}
.gantt-row{display:grid;grid-template-columns:210px 1fr;align-items:center;gap:10px;padding:5px 0}
.gantt-row .nm{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:20px;background:#f6f8fc;border-radius:6px}
.track b{position:absolute;top:2px;height:16px;border-radius:5px;background:var(--brand);display:block;
  font-weight:500;font-size:10.5px;color:#fff;line-height:16px;padding:0 6px;white-space:nowrap;overflow:hidden}
.track b.crit{background:linear-gradient(90deg,#f97316,#ef4444)}
.planbox{border:1.5px solid var(--line);border-radius:var(--r);padding:15px;transition:.18s;cursor:pointer;background:#fff}
.planbox:hover{border-color:var(--brand-s2)}
.planbox.on{border-color:var(--brand);box-shadow:0 10px 24px rgba(37,99,235,.13)}
.planbox .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;color:var(--sub)}
.planbox .kv b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.kan{background:#f7f9fd;border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.kan .h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.tk-card{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px;cursor:pointer;transition:.15s}
.tk-card:hover{border-color:var(--brand);transform:translateY(-1px)}
.tk-card.on{border-color:var(--brand);box-shadow:0 8px 18px rgba(37,99,235,.14)}
.tk-card .n{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:7px;display:flex;gap:8px;justify-content:space-between}
.tk-card .m{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:6px;margin-top:6px}
.msg{display:flex;gap:11px;margin-bottom:18px}
.msg .bub{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 15px;font-size:13.5px;line-height:1.7;max-width:78%}
.msg.u{flex-direction:row-reverse}
.msg.u .bub{background:var(--brand);color:#fff;border-color:var(--brand)}
.msg .bub p{margin:0 0 8px} .msg .bub p:last-child{margin:0}
.flow-node{fill:#fff;stroke:var(--line);stroke-width:1.5}
[data-page-heading]:focus{outline:none}
.me-mobile-income{display:none}
.payroll-details-toggle{display:none}

/* ---------- compact workstation layout ---------- */
@media (max-width:820px){
  .app{display:block;min-width:0}
  .side{width:100%;height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:8px}
  .brand svg{width:54px;height:34px;margin:0}
  .brand .wm{font-size:16px;margin:0;letter-spacing:1.5px}
  .brand .cn,.side h6,.helper{display:none!important}
  .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;overflow:visible;padding:8px 10px 10px}
  .nav button{width:100%;min-height:44px;margin:0;padding:9px 8px;justify-content:center;white-space:nowrap}
  .nav button,.nav .mobile-more{order:initial}
  .nav .mobile-extra{display:none}
  .nav .mobile-more{display:flex}
  .nav .mobile-more-panel{display:none}
  .nav.expanded .mobile-extra{display:flex}
  .main{width:100%;min-width:0}
  .top{padding:10px 12px;gap:8px;flex-wrap:wrap;position:sticky;top:0}
  .top .ttl h1{font-size:18px}
  .top .ttl p,.top .pill,.top .me .nm,.top .me .rl{display:none}
  .top .search{order:5;width:100%}
  .top .btn{padding:8px 10px}
  .view{padding:0 12px 22px}
  .grid{grid-template-columns:minmax(0,1fr)!important}
  .grid[style*="repeat(5"],.grid[style*="repeat(4"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .fusion-split,.fusion-dashboard{grid-template-columns:minmax(0,1fr)!important}
  .frow{grid-template-columns:1fr}
  #formPage>.grid{grid-template-columns:1fr!important}
  .card .hd{flex-wrap:wrap}
  .card .bd{max-width:100%;overflow-x:auto}
  table{min-width:680px}
  .tabs{gap:14px;overflow-x:auto}
  .tabs button{flex:0 0 auto;white-space:nowrap}
  .gantt-row{grid-template-columns:130px minmax(380px,1fr)}
  .execution-actions{order:-1}

var WORKSTATION_RUNTIME=window.QUANTXY_WORKSTATION_RUNTIME||{authMode:'demo',dataMode:'demo'};

var QXY_DEMO_DATA_KEY='qxy.workstation.demo.v2';

var QXY_LEGACY_DATA_KEY='qxy';
var QXY_UI_STATE_KEY='qxy.workstation.ui.v1';
var LOADED_DATA_SOURCE='';

function demoSnapshot(){
  return {tasks:S.tasks,cfg:S.cfg,members:MEMBERS,projects:PROJECTS,kb:KB,
    agents:S.agents,runs:S.runs.slice(0,40),depts:DEPTS,reqs:S.reqs,
    customers:S.customers,activities:S.activities,decisions:S.decisions,

  if(!isDemoRuntime()) return false;
  try{ localStorage.setItem(QXY_DEMO_DATA_KEY,JSON.stringify(demoSnapshot())); return true; }catch(e){ return false; }

  try{
    var raw=localStorage.getItem(key);

  }catch(e){ return null; }
}

  LOADED_DATA_SOURCE='';

  if(current){ LOADED_DATA_SOURCE='v2'; return current; }

  if(legacy){ LOADED_DATA_SOURCE='legacy'; return legacy; }
  return null;
}

  return false;
}

  if(isDemoRuntime()) return false;

    for(var i=localStorage.length-1;i>=0;i--){
      var key=localStorage.key(i);
      if(key===QXY_UI_STATE_KEY||key&&key.indexOf(QXY_UI_STATE_KEY+'.')===0) localStorage.removeItem(key);
    }
    return true;
  }catch(e){ return false; }
}
function restoreUiState(){
  clearFormalDrafts();
  return false;
}
function defaultReviewer(task){
  var project=PB[task.p], candidate=project&&project.own;
  if(!isDemoRuntime()) return task.createdBy||S.me||task.own||'';
  return candidate&&candidate!==task.own?candidate:'m14';
}
function normalizeTask(task){
  var item=task||{}, reviewer=item.reviewer||defaultReviewer(item);
  item.st=item.st==='待审核'?'待验收':(item.st||'待处理');
  item.createdBy=item.createdBy||reviewer;
  item.reviewer=reviewer;
  item.description=item.description||item.n||'';
  item.ac=item.ac||'成果满足任务说明并由验收人确认';
  item.pr=Math.max(0,Math.min(100,Number(item.pr||(item.st==='已完成'?100:0))));
  item.blocker=item.blocker||'';
  item.nextStep=item.nextStep||'';
  item.resultText=item.resultText||'';
  item.resultLink=item.resultLink||'';
  item.resultFiles=Array.isArray(item.resultFiles)?item.resultFiles:[];
  item.acceptedAt=item.acceptedAt||'';
  item.submittedAt=item.submittedAt||'';

  item.reviewNote=item.reviewNote||'';
  item.timeline=Array.isArray(item.timeline)?item.timeline:[];
  if(isDemoRuntime()&&item.st==='进行中'){
    item.acceptedAt=item.acceptedAt||((item.s||fmt(today()))+' 09:00');
    item.nextStep=item.nextStep||'继续推进并同步最新进展';
    if(!item.timeline.length) item.timeline.push({actor:item.own,action:'领取任务',note:'开始执行',at:item.acceptedAt});
  }
  item.revision=Math.max(0,Math.floor(Number(item.revision)||0));
  return item;
}

function findTask(taskId){

function requireDemoActor(actorId){ if(!isDemoRuntime()||actorId!==S.me) throw new Error('forbidden'); return S.me; }
function addTimeline(task,actorId,action,note){
  task.timeline=Array.isArray(task.timeline)?task.timeline:[];
  task.timeline.push({actor:actorId,action:action,note:note||'',at:stamp()});

  input=input||{};

  var task=findTask(input.id);
  if(S.me!==task.createdBy&&S.me!==task.reviewer) throw new Error('forbidden');
  var expected=Number(revision), current=Math.max(0,Math.floor(Number(task.revision)||0));
  if(!Number.isInteger(expected)||expected!==current) throw new Error('revision_conflict');
  var allowed={id:1,n:1,description:1,ac:1,pri:1,s:1,e:1};
  Object.keys(input).forEach(function(key){ if(!allowed[key]) throw new Error('protected_field:'+key); });
  var changes={};
  if(input.n!=null){ var name=String(input.n).trim(); if(!name) throw new Error('task_name_required'); changes.n=name; }
  if(input.description!=null) changes.description=String(input.description).trim();
  if(input.ac!=null) changes.ac=String(input.ac).trim();
  if(input.pri!=null){ if(['P0','P1','P2'].indexOf(input.pri)<0) throw new Error('invalid_priority'); changes.pri=input.pri; }
  if(input.s!=null) changes.s=String(input.s).trim();
  if(input.e!=null) changes.e=String(input.e).trim();
  Object.keys(changes).forEach(function(key){ task[key]=changes[key]; });
  bumpTaskRevision(task); save(); return cloneGatewayValue(task);
}
function claimTask(taskId,actorId){
  actorId=requireDemoActor(actorId);
  var task=findTask(taskId); requireActor(actorId,task.own);
  if(task.st!=='待处理') throw new Error('invalid_status');
  task.st='进行中'; task.acceptedAt=stamp(); task.pr=Math.max(1,task.pr||0);
  addTimeline(task,actorId,'领取任务',''); bumpTaskRevision(task); save(); return task;
}
function updateTaskExecution(taskId,actorId,input){
  actorId=requireDemoActor(actorId);
  var task=findTask(taskId); input=input||{};
  var progress=Number(input.progress); requireActor(actorId,task.own);
  if(task.st!=='进行中') throw new Error('invalid_status');
  if(!isFinite(progress)||progress<0||progress>100) throw new Error('invalid_progress');
  task.pr=progress; task.blocker=String(input.blocker||'').trim(); task.nextStep=String(input.nextStep||'').trim();
  addTimeline(task,actorId,'更新执行','进度 '+progress+'%'+(task.blocker?'；阻塞：'+task.blocker:'')); bumpTaskRevision(task); save(); return task;
}
function submitTaskResult(taskId,actorId,input){
  actorId=requireDemoActor(actorId);
  var task=findTask(taskId); input=input||{};
  var text=String(input.resultText||'').trim(), link=String(input.resultLink||'').trim();
  var fileInput=Array.isArray(input.resultFiles)?input.resultFiles:[];
  var files=fileInput.map(function(name){ return String(name).trim(); }).filter(function(name){ return name; });
  requireActor(actorId,task.own);
  if(task.st!=='进行中') throw new Error('invalid_status');
  if(!text||(!link&&!files.length)) throw new Error('result_required');
  task.resultText=text; task.resultLink=link; task.resultFiles=files; task.submittedAt=stamp(); task.st='待验收';
  addTimeline(task,actorId,'提交验收',text); bumpTaskRevision(task); save(); return task;
}
function reviewTaskResult(taskId,actorId,input){
  actorId=requireDemoActor(actorId);
  var task=findTask(taskId); input=input||{};
  var decision=input.decision, note=String(input.note||'').trim();
  if(actorId!==task.reviewer&&actorId!==task.createdBy) throw new Error('forbidden');
  if(task.st!=='待验收') throw new Error('invalid_status');
  if(decision!=='pass'&&decision!=='reject') throw new Error('invalid_decision');
  if(decision==='reject'&&!note) throw new Error('review_note_required');
  task.reviewNote=note; task.reviewedAt=stamp(); task.st=decision==='pass'?'已完成':'进行中';
  if(decision==='pass') task.pr=100;
  addTimeline(task,actorId,decision==='pass'?'验收通过':'驳回修改',note); bumpTaskRevision(task); save(); return task;
}
function reopenTask(taskId,actorId,note){
  actorId=requireDemoActor(actorId);
  var task=findTask(taskId);
  if(actorId!==task.reviewer&&actorId!==task.createdBy) throw new Error('forbidden');
  if(task.st!=='已完成') throw new Error('invalid_status');
  task.st='进行中'; task.pr=Math.min(95,task.pr);
  addTimeline(task,actorId,'重新打开',String(note||'').trim()); bumpTaskRevision(task); save(); return task;
}

function logoSVG(w){
  var h=Math.round(w*348/540), o='';
  for(var i=0;i<LL.length;i++) o+='<path d="'+LL[i][0]+'" fill="'+LL[i][1]+'"/>';
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 540 348" xmlns="http://www.w3.org/2000/svg" fill-rule="evenodd">'+
    '<path d="'+LP+'" fill="#0d1b3c"/>'+o+'</svg>';
}
function renderBrand(){
  var n=el('brand'); if(!n) return;
  n.innerHTML=logoSVG(120)+
    '<div class="wm">Quant<span class="x">X</span>Y</div>'+
    '<div class="cn"><i></i><span>量 子 星 河</span><i></i></div>';
  try{
    var lk=document.createElement('link'); lk.rel='icon';
    lk.href='data:image/svg+xml,'+encodeURIComponent(logoSVG(64));
    document.head.appendChild(lk);
  }catch(e){}
}

var QXY_DEMO_USER='admin';
var QXY_DEMO_PASS='123456';
var QXY_AUTH_KEY='qxy_demo_auth';
var LOGIN={user:'',pass:'',remember:true,show:false,error:'',memory:false,busy:false,authenticated:false,checked:false};
function authState(){
  if(location.protocol!=='file:') return LOGIN.authenticated;
  if(LOGIN.memory) return true;
  try{ if(sessionStorage.getItem(QXY_AUTH_KEY)==='1') return true; }catch(e){}
  try{ if(localStorage.getItem(QXY_AUTH_KEY)==='1') return true; }catch(e){}
  return false;
}
function setAuthState(remember){
  LOGIN.memory=true;
  LOGIN.authenticated=true;
  if(location.protocol!=='file:') return;
  try{
    if(remember){ localStorage.setItem(QXY_AUTH_KEY,'1'); sessionStorage.removeItem(QXY_AUTH_KEY); }
    else { sessionStorage.setItem(QXY_AUTH_KEY,'1'); localStorage.removeItem(QXY_AUTH_KEY); }
  }catch(e){}
}
function renderLogin(){

  if(app) app.classList.add('auth-hidden');

  gate.hidden=false;
  gate.innerHTML=j([

  renderLogin();
  fetch('/api/demo-auth/login',{method:'POST',credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:LOGIN.user,password:LOGIN.pass,remember:LOGIN.remember})})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ if(!r.ok) throw new Error(d.error||'login_failed'); return d; }); })

    .catch(function(e){

      renderLogin();

var AVC = ['#2563eb','#7c3aed','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899','#14b8a6'];
function avc(name){ var s=0; for(var i=0;i<name.length;i++) s+=name.charCodeAt(i); return AVC[s%AVC.length]; }
function av(name,lg){ return '<span class="av'+(lg?' lg':'')+'" style="background:'+avc(name)+'">'+esc(name.slice(-2,-1)||name[0])+'</span>'; }

/* ---------------- 图表（手写 SVG） ---------------- */
function spark(data,color,w,h){
  w=w||150; h=h||36; var mn=Math.min.apply(null,data), mx=Math.max.apply(null,data), rg=(mx-mn)||1;
  var pts=data.map(function(v,i){ return [ i*(w/(data.length-1)), h-4-((v-mn)/rg)*(h-10) ]; });
  var d='M'+pts.map(function(p){ return p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' L');
  var area=d+' L'+w+' '+h+' L0 '+h+' Z';
  var id=uid('g');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+color+'" stop-opacity=".22"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+id+')"/><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round"/></svg>';
}
function donut(segs,size,center,sub){
  size=size||160; var r=size/2-11, c=size/2, C=2*Math.PI*r, off=0;
  var tot=segs.reduce(function(a,b){ return a+b.v; },0)||1;
  var arcs=segs.map(function(s){
    var len=s.v/tot*C, o=off; off+=len;
    return '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+s.c+'" stroke-width="17" stroke-linecap="butt"'+
      ' stroke-dasharray="'+(len-1.5).toFixed(2)+' '+(C-len+1.5).toFixed(2)+'" stroke-dashoffset="'+(-o).toFixed(2)+'" transform="rotate(-90 '+c+' '+c+')"/>';
  }).join('');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+arcs+
    (center?'<text x="'+c+'" y="'+(c+(sub?0:5))+'" text-anchor="middle" font-size="20" font-weight="650" fill="#1b2440">'+center+'</text>':'')+
    (sub?'<text x="'+c+'" y="'+(c+18)+'" text-anchor="middle" font-size="11" fill="#98a2ba">'+sub+'</text>':'')+'</svg>';
}
function ring(pct,color,size,label){
  size=size||84; var r=size/2-7, c=size/2, C=2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="#eef1f8" stroke-width="8"/>'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round"'+
    ' stroke-dasharray="'+(C*pct/100).toFixed(1)+' '+C+'" transform="rotate(-90 '+c+' '+c+')"/>'+
    '<text x="'+c+'" y="'+(c+2)+'" text-anchor="middle" font-size="15" font-weight="650" fill="#1b2440">'+pct+'%</text>'+
    (label?'<text x="'+c+'" y="'+(c+16)+'" text-anchor="middle" font-size="9.5" fill="#98a2ba">'+label+'</text>':'')+'</svg>';
}
function lines(series,labels,w,h,fmtY){
  w=w||600; h=h||220; var pl=44,pr=10,pt=12,pb=26, iw=w-pl-pr, ih=h-pt-pb;
  var all=[]; series.forEach(function(s){ all=all.concat(s.d); });
  var mx=Math.max.apply(null,all)*1.12, mn=0, rg=(mx-mn)||1;
  var g=[],i;
  for(i=0;i<=4;i++){ var y=pt+ih-ih*i/4; g.push('<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'" stroke="#f1f4fa"/>'+
    '<text x="'+(pl-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#98a2ba">'+(fmtY?fmtY(mx*i/4):Math.round(mx*i/4))+'</text>'); }
  var xs=function(i,n){ return pl+(n<2?iw/2:i*(iw/(n-1))); };
  var paths=series.map(function(s){
    var pts=s.d.map(function(v,i){ return xs(i,s.d.length).toFixed(1)+' '+(pt+ih-(v-mn)/rg*ih).toFixed(1); });
    var dots=s.d.map(function(v,i){ return '<circle cx="'+xs(i,s.d.length).toFixed(1)+'" cy="'+(pt+ih-(v-mn)/rg*ih).toFixed(1)+'" r="2.6" fill="#fff" stroke="'+s.c+'" stroke-width="1.8"/>'; }).join('');
    return '<path d="M'+pts.join(' L')+'" fill="none" stroke="'+s.c+'" stroke-width="2" stroke-linejoin="round"/>'+dots;
  }).join('');
  var xl=labels.map(function(t,i){ return (i%Math.ceil(labels.length/7)===0)?'<text x="'+xs(i,labels.length).toFixed(1)+'" y="'+(h-7)+'" text-anchor="middle" font-size="10.5" fill="#98a2ba">'+t+'</text>':''; }).join('');
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'">'+g.join('')+paths+xl+'</svg>';
}
function bars(data,labels,w,h,colors){
  w=w||600;h=h||210; var pl=44,pr=8,pt=12,pb=26,iw=w-pl-pr,ih=h-pt-pb;
  var mx=Math.max.apply(null,[].concat.apply([],data))*1.15||1;
  var n=labels.length, gw=iw/n, bw=Math.min(16,(gw-10)/data.length);
  var out='',i,k;
  for(i=0;i<=4;i++){ var y=pt+ih-ih*i/4; out+='<line x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'" stroke="#f1f4fa"/>'+
    '<text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="#98a2ba">'+Math.round(mx*i/4)+'</text>'; }
  for(k=0;k<data.length;k++){ for(i=0;i<n;i++){
    var v=data[k][i], bh=v/mx*ih, x=pl+gw*i+gw/2-(bw*data.length+4*(data.length-1))/2+k*(bw+4);
    out+='<rect x="'+x.toFixed(1)+'" y="'+(pt+ih-bh).toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" rx="3" fill="'+colors[k]+'"/>';
  }}
  labels.forEach(function(t,i){ out+='<text x="'+(pl+gw*i+gw/2)+'" y="'+(h-7)+'" text-anchor="middle" font-size="10.5" fill="#98a2ba">'+t+'</text>'; });
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'">'+out+'</svg>';
}
function legend(items){
  return '<div style="display:flex;flex-direction:column;gap:9px">'+items.map(function(s){
    return '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px"><i style="width:8px;height:8px;border-radius:50%;background:'+s.c+';display:block"></i>'+
      '<span style="color:var(--sub);flex:1">'+esc(s.n)+'</span><b style="font-variant-numeric:tabular-nums">'+esc(s.r)+'</b></div>';
  }).join('')+'</div>';
}

/* ---------------- 调度引擎 ---------------- */
/* 1) 拓扑排序 */
function topo(ts){
  var byId={}, indeg={}, out=[], q=[];
  ts.forEach(function(t){ byId[t.id]=t; indeg[t.id]=0; });
  ts.forEach(function(t){ (t.dep||[]).forEach(function(d){ if(byId[d]) indeg[t.id]++; }); });
  ts.forEach(function(t){ if(!indeg[t.id]) q.push(t.id); });
  while(q.length){
    var id=q.shift(); out.push(id);
    ts.forEach(function(t){ if((t.dep||[]).indexOf(id)>=0){ if(--indeg[t.id]===0) q.push(t.id); } });
  }
  ts.forEach(function(t){ if(out.indexOf(t.id)<0) out.push(t.id); }); // 环兜底
  return out;
}
/* 2) 资源池：每个角色可投入的人数上限决定并行度 */
function pool(perRole){
  var by={}, out=[];
  MEMBERS.forEach(function(m){ if(m.r==='企业决策人') return; (by[m.r]=by[m.r]||[]).push(m); });
  Object.keys(by).forEach(function(r){
    by[r].sort(function(a,b){ return b.cap-a.cap; });
    out=out.concat(by[r].slice(0,perRole));
  });
  return out;
}
var ROLE_SKILL_DEFAULTS={
  '产品经理':['需求分析','客户访谈','产品规划'],'项目经理':['项目管理','风险管理','跨部门协作'],
  '架构师':['系统架构','技术选型','数据契约'],'设计师':['交互设计','视觉设计','设计系统'],
  '前端工程师':['前端开发','TypeScript','性能优化'],'后端工程师':['后端开发','数据库','接口设计'],
  '算法工程师':['AI能力','数据建模','模型调优'],'测试工程师':['测试设计','自动化测试','验收'],
  '运维工程师':['发布部署','CI/CD','稳定性'],'运营':['运营增长','内容运营','渠道']
};
function skillKey(v){ return String(v||'').toLowerCase().replace(/[\s·・_\-/]+/g,''); }
function taskSkills(t){
  var own=Array.isArray(t&&t.skills)?t.skills:[];
  var base=own.length?own:(ROLE_SKILL_DEFAULTS[t&&t.role]||[]);
  return base.map(function(v){return String(v||'').trim();}).filter(Boolean).slice(0,8);
}
function memberSkills(m){
  var wp=m&&m.workProfile||{}, out=[], seen={};
  function add(name,level,verified){ var n=String(name||'').trim(),k=skillKey(n); if(!n||seen[k]) return; seen[k]=1; out.push({name:n,level:Math.max(1,Math.min(5,parseInt(level,10)||3)),verified:!!verified}); }
  (wp.verifiedSkills||[]).forEach(function(s){add(s.name,s.level,true);});
  (wp.selfSkills||[]).forEach(function(s){add(s.name,s.level,false);});
  String(m&&m.sk||'').split(/[·・,，、;；|]/).forEach(function(n){add(n,3,false);});
  return out;
}
function candidateMatch(m,t){
  var wp=m&&m.workProfile||{}, req=taskSkills(t), have=memberSkills(m), matched=[];
  req.forEach(function(r){ var rk=skillKey(r), hit=have.filter(function(s){var sk=skillKey(s.name);return sk===rk||sk.indexOf(rk)>=0||rk.indexOf(sk)>=0;})[0]; if(hit) matched.push(hit); });
  var exactRole=!!(m&&t&&m.r===t.role), relatedRole=!!(m&&t&&(String(t.role||'').indexOf(String(m.r||'').slice(0,2))>=0||String(m.r||'').indexOf(String(t.role||'').slice(0,2))>=0));
  var roleScore=exactRole?40:(relatedRole?28:7);
  var skillScore=req.length?Math.round(28*matched.reduce(function(sum,s){return sum+(s.verified?1:0.78)*(0.7+s.level*0.06);},0)/req.length):17;
  var onTime=isFinite(Number(wp.onTimeRate))?Number(wp.onTimeRate):75;
  var sample=Number(wp.performanceSampleCount)||0;
  var quality=sample>=3&&isFinite(Number(wp.qualityScore))?Number(wp.qualityScore):75;
  var efficiency=sample>=3&&isFinite(Number(wp.efficiencyScore))?Number(wp.efficiencyScore):75;
  var workload=isFinite(Number(wp.workloadPercent))?Number(wp.workloadPercent):Math.round((1-(Number(m&&m.cap)||0.7))*100);
  var deliveryScore=Math.round(Math.max(0,Math.min(100,onTime))*.06)+Math.round(Math.max(0,Math.min(100,quality))*.06)+Math.round(Math.max(0,Math.min(100,efficiency))*.04);
  var capacityScore=Math.round(Math.max(0,100-Math.max(0,workload))*.09);
  var pref=(wp.preferredTaskTypes||[]).concat(wp.growthGoals||[]).some(function(x){var k=skillKey(x);return skillKey(t&&t.n).indexOf(k)>=0||req.some(function(r){return skillKey(r).indexOf(k)>=0||k.indexOf(skillKey(r))>=0;});});
  var penalty=Math.min(10,(Number(wp.overdueTaskCount)||0)*3)+(workload>90?6:0);
  var score=Math.max(1,Math.min(99,roleScore+skillScore+deliveryScore+capacityScore+(pref?4:0)-penalty));
  var reasons=[exactRole?'职能匹配：'+m.r:(relatedRole?'相近职能：'+m.r:'跨职能候选：'+m.r)];
  reasons.push('匹配技能：'+(matched.length?matched.map(function(s){return s.name;}).join('、'):'暂无直接匹配'));
  reasons.push('当前负荷：'+Math.round(workload)+'%'); reasons.push('按时交付：'+Math.round(onTime)+'%');
  if(sample>=3){ reasons.push('质量表现：'+Math.round(quality)+'%'); reasons.push('效率表现：'+Math.round(efficiency)+'%'); }
  else reasons.push('历史任务证据不足3项，暂不做绩效加权');
  if(pref) reasons.push('符合个人偏好或成长方向');
  return {memberId:m.id,score:score,matchedSkills:matched.map(function(s){return s.name;}),workload:Math.round(workload),onTimeRate:Math.round(onTime),qualityScore:Math.round(quality),efficiencyScore:Math.round(efficiency),performanceSampleCount:sample,reasons:reasons};
}
/* 3) 排期：依赖 + 人员可用性 + 关键路径 */
function schedule(ts, opt){
  var P=pool(opt.perRole), byId={}, free={}, map={};
  ts.forEach(function(t){ byId[t.id]=t; });
  var order=topo(ts);
  order.forEach(function(id){
    var t=byId[id]; if(!t) return;
    var es=0;
    (t.dep||[]).forEach(function(d){ if(map[d]) es=Math.max(es,map[d].e); });
    var cands=P.filter(function(m){ return m.r===t.role; });
    if(!cands.length) cands=P.filter(function(m){ return t.role.indexOf(m.r.slice(0,2))>=0; });
    if(!cands.length) cands=P.slice();
    var ranked=cands.map(function(m){ var match=candidateMatch(m,t); return {member:m,match:match,effective:match.score-Math.min(20,(free[m.id]||0)*2)}; });
    ranked.sort(function(a,b){ return b.effective-a.effective || (free[a.member.id]||0)-(free[b.member.id]||0) || b.member.cap-a.member.cap; });
    var m=ranked[0].member;
    var st=Math.max(es, free[m.id]||0);
    var dur=Math.max(1, Math.round((t.days||3)*opt.speed));
    map[id]={s:st, e:st+dur, dur:dur, own:m.id, aiOwn:m.id, manual:false, match:ranked[0].match, aiMatch:ranked[0].match, candidates:ranked.slice(0,3).map(function(x){return x.match;})};
    free[m.id]=st+dur;
  });
  var total=0; order.forEach(function(id){ if(map[id]) total=Math.max(total,map[id].e); });
  /* 逆推最晚完成时间 → 松弛 → 关键路径 */
  var lf={};
  order.slice().reverse().forEach(function(id){
    var succ=ts.filter(function(x){ return (x.dep||[]).indexOf(id)>=0 && map[x.id]; });
    lf[id]= succ.length ? Math.min.apply(null, succ.map(function(s){ return lf[s.id]-map[s.id].dur; })) : total;
  });
  /* 成本按「原始人天 × 日成本」计算：压缩工期＝增加投入，不会让项目变便宜 */
  var cost=0, work=0;
  order.forEach(function(id){ if(!map[id]) return;
    map[id].slack=lf[id]-map[id].e; map[id].crit=map[id].slack<=0;
    cost+=(Number(MB[map[id].own].rate)||0)*(byId[id].days||map[id].dur); work+=map[id].dur; });
  var used={}; order.forEach(function(id){ if(map[id]) used[map[id].own]=(used[map[id].own]||0)+map[id].dur; });
  /* 利用率＝成员在其参与档期内的实际占用率（等待空档越多越低） */
  var span={},us=[];
  order.forEach(function(id){ var m=map[id]; if(!m) return;
    var v=span[m.own]=span[m.own]||{a:m.s,b:m.e,w:0};
    v.a=Math.min(v.a,m.s); v.b=Math.max(v.b,m.e); v.w+=m.dur; });
  Object.keys(span).forEach(function(k){ var v=span[k]; us.push(v.w/Math.max(1,v.b-v.a)); });
  var util=us.length?Math.max(35,Math.min(99,Math.round(us.reduce(function(a,b){ return a+b; },0)/us.length*100))):0;
  var peak=1,d,c;
  for(d=0;d<total;d++){ c=0; order.forEach(function(id){ if(map[id]&&map[id].s<=d&&d<map[id].e) c++; }); if(c>peak) peak=c; }
  return { map:map, days:total, cost:Math.round(cost*opt.rate), util:util, heads:Object.keys(used).length, peak:peak, order:order };
}

function assignScheduleMember(taskId,memberId){
  var pl=selectedSchedulePlan(), task=(S.sch.tasks||[]).filter(function(t){ return t.id===taskId; })[0], member=MB[memberId];
  if(!pl||!task||!member||!pl.map||!pl.map[taskId]) return false;
  var slot=pl.map[taskId];
  if(!slot.aiOwn) slot.aiOwn=slot.own;
  if(!slot.aiMatch) slot.aiMatch=slot.match||candidateMatch(MB[slot.aiOwn]||member,task);
  var prev=slot.own, ai=MB[slot.aiOwn]||member, nextMatch=candidateMatch(member,task), reasons=[];
  if(nextMatch.score+8<slot.aiMatch.score) reasons.push('低于 AI 推荐 '+(slot.aiMatch.score-nextMatch.score)+' 分');
  if(nextMatch.workload>=75) reasons.push('此人当前负载较高');
  if(nextMatch.matchedSkills.length<((slot.aiMatch&&slot.aiMatch.matchedSkills)||[]).length) reasons.push('技能匹配度较低');
  if(!reasons.length&&memberId!==slot.aiOwn) reasons.push('人工改派，负责人最终确认');
  slot.own=memberId; slot.manual=memberId!==slot.aiOwn; slot.match=nextMatch; slot.manualReason=reasons.join('；');
  slot.manualAudit=slot.manualAudit||[];
  if(slot.manual) slot.manualAudit.push({at:new Date().toISOString(),from:prev,to:memberId,ai:slot.aiOwn,reason:slot.manualReason||'人工改派，负责人最终确认'});
  else slot.manualAudit.push({at:new Date().toISOString(),from:prev,to:memberId,ai:slot.aiOwn,reason:'恢复为 AI 推荐人选'});
  return true;
}
/* 4) 三套方案：均衡 / 快速交付 / 成本优化 */
function makePlans(ts){
  var A=schedule(ts,{perRole:2, speed:1.00, rate:1.00});
  var B=schedule(ts,{perRole:3, speed:0.78, rate:1.22});
  var C=schedule(ts,{perRole:1, speed:1.18, rate:0.86});
  var base=today();
  function wrap(k,name,tagline,r,speed){
    return { k:k, name:name, tag:tagline, days:r.days, cost:r.cost, util:r.util, heads:r.heads, peak:r.peak, map:r.map,
      inten:Math.round(100/speed),
      end:fmt(addD(base,r.days)),
      score:{ speed:Math.round(100-(r.days/ (Math.max(A.days,B.days,C.days))*45)), cost:Math.round(100-(r.cost/Math.max(1,A.cost,B.cost,C.cost)*55)), risk:k==='B'?55:(k==='C'?72:84) } };
  }
  return [ wrap('A','方案 A（推荐）','按标准投入强度排期，进度与成本平衡，风险可控。',A,1.00),
           wrap('B','方案 B（快速交付）','单任务加派人手压缩工期，人天不变但协作成本更高。',B,0.78),
           wrap('C','方案 C（成本优化）','降低投入强度、拉长周期，换取更低的人力成本。',C,1.18) ];
}

/* 6) 调用同源服务端接口；模型密钥只由服务器解密并转发 */
var AI_MODELS=['deepseek-v4-flash','deepseek-chat','deepseek-reasoner'];
var LOCAL_SECURE_WORKSTATION_URL='http://127.0.0.1:3011/quantxy-ai-workbench-fused.html';
function aiCall(body){
  var payload={max_tokens:body.max_tokens||1200,messages:body.messages||[]};
  if(body.system) payload.system=body.system;
  if(body.structured_output===true) payload.structured_output=true;
  return fetch('/api/ai/chat',{method:'POST',credentials:'same-origin',
    headers:{'content-type':'application/json'},body:JSON.stringify(payload)}).then(function(r){
    return r.text().then(function(txt){
      var d=null; try{ d=JSON.parse(txt); }catch(e){}
      if(!r.ok){
        var m=(d&&d.error)||'request_failed';
        throw new Error('HTTP '+r.status+'：'+m);
      }
      if(!d) throw new Error('服务端返回内容不是 JSON');
      return d;
    });
  });
}
function aiText(d,finalOnly){
  if(!d) return '';
  if(d.choices&&d.choices.length){
    var m=d.choices[0].message||{};
    return m.content||(finalOnly?'':m.reasoning_content)||'';
  }
  return ((d.content)||[]).filter(function(c){ return c.type==='text'; }).map(function(c){ return c.text; }).join('\n');
}
/* 把底层报错翻译成能直接照做的话 */
function diagnose(e){
  var m=(e&&e.message)||String(e||'');
  if(/Failed to fetch|NetworkError|Load failed|ERR_|upstream_unavailable/i.test(m))
    return '暂时无法连接服务器端模型服务，请稍后重试或联系管理员检查部署状态。';
  if(/\b401\b|unauthorized/i.test(m)) return '登录状态已失效，请重新登录后再试。';
  if(/\b403\b|forbidden/i.test(m)) return '当前账号没有模型配置权限。';
  if(/ai_not_configured/i.test(m)) return '尚未配置模型密钥，请由任一已登录的内部人员在系统设置中更新。';
  if(/upstream_auth_failed/i.test(m)) return '模型密钥验证失败，请由管理员更新密钥。';
  if(/\b402\b|Insufficient Balance|balance/i.test(m))
    return '账户余额不足（402），到 DeepSeek 平台充值后即可恢复。';
  if(/\b429\b|rate_limited/i.test(m)) return '请求较多，请稍等一分钟后再试。';
  if(/upstream_timeout/i.test(m)) return '模型响应超时，请稍后重试。';
  if(/upstream_invalid_response/i.test(m)) return 'AI 输出格式异常，请重新生成。';
  if(/\b5\d\d\b|upstream_failed|invalid_server_config/i.test(m)) return '模型服务暂时不可用，请联系管理员检查配置。';
  return m;
}
function testAI(){

}
function applyAiConfig(d){

  S.aiConfig.apiBaseUrl=typeof d.apiBaseUrl==='string'?d.apiBaseUrl:'https://api.deepseek.com';
  S.aiConfig.model=AI_MODELS.indexOf(d.model)>=0?d.model:'deepseek-v4-flash';
  S.aiConfig.keyConfigured=!!d.keyConfigured;
  S.aiConfig.keyHint=typeof d.keyHint==='string'?d.keyHint:null;

function aiConfigError(code,status){
  if(status===401||code==='unauthorized') return '登录状态已失效，请重新登录。';
  if(status===403||code==='forbidden') return '当前账号没有模型配置权限。';
  if(code==='invalid_model') return '请选择可用的模型。';
  if(code==='invalid_api_key') return '密钥格式不正确，请检查后重新输入。';
  return '模型配置服务暂时不可用，请联系管理员检查服务器部署。';
}
function expireSession(){
  LOGIN.authenticated=false; LOGIN.checked=true; LOGIN.error='登录状态已失效，请重新登录';
  S.aiConfig.canManage=false; S.aiConfig.loaded=false; S.aiConfig.loading=false; S.aiConfig.saving=false;
  renderLogin();
}
function loadAiConfig(force){
  if(S.aiConfig.loading||(!force&&S.aiConfig.loaded)) return;
  if(location.protocol==='file:'){
    S.aiConfig.loaded=true; S.aiConfig.loading=false; S.aiConfig.error='';
    if(S.page==='set') render();
    return;
  }
  S.aiConfig.loading=true; S.aiConfig.error='';
  if(S.page==='set') render();
  fetch('/api/ai/config',{credentials:'same-origin',cache:'no-store'}).then(function(r){
    return r.text().then(function(txt){
      var d=null; try{ d=JSON.parse(txt); }catch(e){}
      if(r.status===401){ expireSession(); return null; }
      if(!r.ok) throw new Error(aiConfigError(d&&d.error,r.status));
      if(!d) throw new Error(aiConfigError('',r.status));
      return d;
    });
  }).then(function(d){ if(!d) return; applyAiConfig(d); S.aiConfig.loaded=true; })
    .catch(function(e){ if(!LOGIN.authenticated) return; S.aiConfig.loaded=true; S.aiConfig.error=(e&&e.message)||aiConfigError('',0); })

}
var AI_CONFIG_REQUEST_ID_PATTERN=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
function createAiConfigRequestId(){
  var secureCrypto=window&&window.crypto;
  if(!secureCrypto||typeof secureCrypto.randomUUID!=='function') throw new Error('安全请求标识不可用，请使用支持 Web Crypto 的浏览器');
  var requestId=secureCrypto.randomUUID();
  if(!AI_CONFIG_REQUEST_ID_PATTERN.test(requestId)) throw new Error('安全请求标识无效，请重试');
  return requestId;
}
function updateAiConfig(includeKey){
  if(S.aiConfig.saving) return;
  var modelEl=el('cfgModel'), keyEl=el('cfgNewKey');
  var model=modelEl?modelEl.value:S.aiConfig.model;
  var payload={model:model};
  if(includeKey){
    var key=keyEl?keyEl.value.trim():'';
    if(!key){ toast('请先输入新的 API Key'); return; }
    if(key.indexOf('sk-')!==0||key.length<12){ toast('密钥格式不正确，请重新输入'); return; }
    payload.apiKey=key;
    if(keyEl) keyEl.value='';
  }
  var requestId;
  try{ requestId=createAiConfigRequestId(); }
  catch(e){ S.aiConfig.error=(e&&e.message)||'安全请求标识不可用'; toast(S.aiConfig.error); return; }
  S.aiKeyDraft=''; S.showKey=false; S.aiConfig.saving=true; S.aiConfig.error='';
  render();
  fetch('/api/ai/config',{method:'PUT',credentials:'same-origin',
    headers:{'content-type':'application/json','Idempotency-Key':requestId},body:JSON.stringify(payload)}).then(function(r){
    return r.text().then(function(txt){
      var d=null; try{ d=JSON.parse(txt); }catch(e){}
      if(r.status===401){ expireSession(); return null; }
      if(!r.ok) throw new Error(aiConfigError(d&&d.error,r.status));
      if(!d) throw new Error(aiConfigError('',r.status));
      return d;
    });
  }).then(function(d){
    if(!d) return;
    applyAiConfig(d); S.aiConfig.loaded=true; S.aiTest=null;
    toast(includeKey?'密钥已安全更新':'模型已更新');
  }).catch(function(e){
    if(!LOGIN.authenticated) return;
    S.aiConfig.error=(e&&e.message)||aiConfigError('',0); toast(S.aiConfig.error);
  }).then(function(){ if(!LOGIN.authenticated) return; S.aiConfig.saving=false; render(); });
}
function stripFence(t){ return String(t).replace(/\u0060\u0060\u0060(json)?/g,'').trim(); }

function aiDecompose(goal, deadline, budget, must){
  var sys='你是企业级项目调度专家。把战略目标拆解为可执行的任务清单（WBS），只输出 JSON，不要任何解释、前缀或代码块标记。'+
    '严格格式：{"tasks":[{"id":"W1","ph":"阶段名","n":"任务名","role":"角色","skills":["关键技能"],"days":3,"dep":["W0"],"pri":"P0","ac":"验收标准"}]}。'+
    '要求：12-16 个任务；分 4-6 个阶段；role 必须从以下取值：'+ROLES.join('、')+'；'+
    'dep 只能引用更早的 id；days 为整数人天；pri 取 P0/P1/P2；ac 为一句可判定的验收标准；全部中文。';
  var pmt='战略目标：'+goal+'\n硬性截止：'+deadline+'\n预算上限：'+budget+' 万元\n关键约束：'+(must||'无')+'\n请输出任务拆解 JSON。';
  return aiCall({model:S.cfg.model, max_tokens:2400, structured_output:true, system:sys, messages:[{role:'user',content:pmt}]})
    .then(function(d){
      var t=stripFence(aiText(d,true));
      var o=JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}')+1));
      if(!o.tasks || !o.tasks.length) throw new Error('empty');
      var ids={}; o.tasks.forEach(function(x){ ids[x.id]=1; });
      return o.tasks.map(function(x,i){
        return { id:x.id||('W'+(i+1)), ph:x.ph||'执行阶段', n:x.n||('任务'+(i+1)), role:ROLES.indexOf(x.role)>=0?x.role:'产品经理',
          skills:(Array.isArray(x.skills)?x.skills:[]).filter(function(skill){ return typeof skill==='string'&&skill.trim(); }).slice(0,8).map(function(skill){ return skill.trim().slice(0,40); }),
          days:Math.max(1,parseInt(x.days,10)||3), dep:(x.dep||[]).filter(function(d){ return ids[d] && d!==x.id; }),
          pri:['P0','P1','P2'].indexOf(x.pri)>=0?x.pri:'P1', ac:x.ac||'达成任务目标并通过评审' };
      });
    });
}

function matchScore(m,role,task){ return candidateMatch(m,task||{role:role,skills:[]}).score; }
function depGraph(ts,map){
  var byId={},lvl={},cols={},order=topo(ts);
  ts.forEach(function(t){ byId[t.id]=t; });
  order.forEach(function(id){ var t=byId[id]; if(!t) return;
    lvl[id]=(t.dep&&t.dep.length)?Math.max.apply(null,t.dep.map(function(d){ return (lvl[d]||0)+1; })):0;
    (cols[lvl[id]]=cols[lvl[id]]||[]).push(id); });
  var ks=Object.keys(cols).map(Number).sort(function(a,b){return a-b;});
  var maxRow=0; ks.forEach(function(k){ maxRow=Math.max(maxRow,cols[k].length); });
  var W=ks.length*122+28, H=maxRow*52+28, pos={};
  ks.forEach(function(k,ci){ cols[k].forEach(function(id,ri){
    pos[id]={x:16+ci*122, y:14+ri*52+(maxRow-cols[k].length)*26};
  }); });
  var edges='',nodes='';
  ts.forEach(function(t){ (t.dep||[]).forEach(function(d){
    if(!pos[d]||!pos[t.id]) return;
    var a=pos[d],b=pos[t.id], x1=a.x+96,y1=a.y+17,x2=b.x,y2=b.y+17, mx=(x1+x2)/2;
    var cr=map&&map[d]&&map[t.id]&&map[d].crit&&map[t.id].crit;
    edges+='<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+(x2-6)+' '+y2+'" fill="none" stroke="'+(cr?'#ef4444':'#c9d5ee')+'" stroke-width="'+(cr?1.8:1.3)+'"'+(cr?' stroke-dasharray="5 4"':'')+'/>'+
      '<circle cx="'+(x2-4)+'" cy="'+y2+'" r="2.6" fill="'+(cr?'#ef4444':'#c9d5ee')+'"/>';
  }); });
  ts.forEach(function(t){ var p=pos[t.id]; if(!p) return; var m=map&&map[t.id];
    var on=S.sel.wbs===t.id, crit=m&&m.crit;
    nodes+='<g style="cursor:pointer" data-act="pick-wbs" data-id="'+attr(t.id)+'">'+
      '<rect x="'+p.x+'" y="'+p.y+'" width="96" height="34" rx="8" fill="'+(on?'#eef3ff':'#fff')+'" stroke="'+(on?'#2563eb':(crit?'#fca5a5':'#e9edf5'))+'" stroke-width="'+(on?2:1.2)+'"/>'+
      '<text x="'+(p.x+9)+'" y="'+(p.y+15)+'" font-size="10" fill="#1b2440" font-weight="600">'+esc(t.n.length>7?t.n.slice(0,7)+'…':t.n)+'</text>'+
      '<text x="'+(p.x+9)+'" y="'+(p.y+27)+'" font-size="8.8" fill="#98a2ba">'+esc(t.role)+(m?' · '+m.dur+'d':'')+'</text>'+
      (crit?'<circle cx="'+(p.x+88)+'" cy="'+(p.y+8)+'" r="3" fill="#ef4444"/>':'')+'</g>';
  });
  return '<div class="compact-dependency-graph" style="overflow:auto"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+edges+nodes+'</svg></div>';
}

function viewProj(){
  var cats=['全部','AI研发','产品开发','市场活动','内部管理','数据治理'];
  var q=(S.f.projQ||'').trim();
  var list=PROJECTS.filter(function(p){
    if(S.f.projCat!=='all'&&p.cat!==S.f.projCat) return false;
    if(S.f.projSt!=='all'&&p.st!==S.f.projSt) return false;
    return !q||(p.n+p.cat).indexOf(q)>=0;
  });
  var projectTotals=PROJECTS.reduce(function(acc,p){
    var st=p.st||'进行中', budget=Number(p.bud||0), progress=Math.max(0,Math.min(100,Number(p.pr)||0));
    acc.total++;
    if(st==='已完成') acc.done++;
    else if(st==='风险'||st==='延期'||st==='已逾期') acc.risk++;
    else acc.active++;
    acc.budget+=budget;
    acc.used+=budget*progress/100;
    acc.health+=Number(p.health||0);
    return acc;
  },{total:0,active:0,done:0,risk:0,budget:0,used:0,health:0});
  var avgHealth=projectTotals.total?Math.round(projectTotals.health/projectTotals.total):0;

  '<div class="card fade" data-project-overview data-state="calculated"><div class="hd"><h3>项目总览</h3><div class="grow"></div><span class="sm">来自当前项目实时累计</span></div><div class="bd" style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">',

        '<div style="font-size:11.5px;color:var(--mut)">较上月 <span class="up">'+x[2]+'</span></div></div>';
    }).join(''),
    '<div style="display:flex;align-items:center;gap:10px">'+ring(avgHealth||0,avgHealth>=80?'#10b981':avgHealth>=70?'#f59e0b':'#ef4444',72,'健康度')+'<div><div style="font-size:12.5px;color:var(--sub)">平均健康度</div><div style="font-size:11.5px;color:var(--mut);margin-top:4px">当前 <span class="up">'+(avgHealth||0)+' 分</span></div></div></div>',
  '</div></div>',

  '<div class="card" style="margin-top:16px"><div class="bd" style="display:flex;align-items:center;gap:14px">',

    '</div><div class="search" style="width:200px">'+ic('search',15)+'<input data-q="projQ" value="'+esc(q)+'" placeholder="搜索项目"></div>',
    '<select class="sel" style="width:130px" data-q="projSt">'+['all','进行中','已完成','风险'].map(function(v){
      return '<option value="'+v+'"'+(S.f.projSt===v?' selected':'')+'>'+(v==='all'?'全部状态':v)+'</option>'; }).join('')+'</select>',
    '<button class="btn" data-act="go" data-page="new-project">'+ic('plus',15)+'新建项目</button></div></div>',

function fieldValue(id){ var node=el(id); return node?node.value.trim():''; }
function readExecutionInput(){ return {progress:Number(fieldValue('execProgress')),blocker:fieldValue('execBlocker'),nextStep:fieldValue('execNextStep')}; }
function readResultInput(){ return {resultText:fieldValue('execResultText'),resultLink:fieldValue('execResultLink'),resultFiles:fieldValue('execResultFiles').split(/\r?\n/).map(function(v){ return v.trim(); }).filter(Boolean)}; }
function taskError(error){
  var code=String(error&&error.message||error);
  return {real_write_not_configured:'真实数据写接口未配置',real_data_service_unavailable:'真实数据写接口未配置',forbidden:'当前身份没有此操作权限',invalid_status:'当前任务状态不允许此操作',invalid_progress:'进度必须在 0 到 100 之间',result_required:'请填写成果说明，并提供成果链接或文件名称',review_note_required:'驳回时必须填写验收意见',invalid_decision:'验收决定无效',task_not_found:'任务不存在',task_update_failed:'任务已变化，请刷新后重试',task_create_failed:'任务下发失败，请检查项目和成员权限'}[code]||'任务操作失败';
}
function mergeTaskMutation(task){
  if(!task||!task.id) return;
  for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id===task.id){ Object.assign(S.tasks[i],task); normalizeTask(S.tasks[i]); break; }
}
function runTaskMutation(operation,message){
  try{
    var result=operation();
    if(result&&typeof result.then==='function'){
      result.then(function(task){ mergeTaskMutation(task); render(); toast(message); })
        .catch(function(error){ toast(taskError(error)); });
    }else{ mergeTaskMutation(result); render(); toast(message); }
  }catch(error){ toast(taskError(error)); }
}
function taskNotificationStatus(notification){
  var status=notification&&notification.status;
  return {sent:'飞书通知已送达',failed:'飞书通知暂未送达',unavailable:'未同步飞书身份',pending:'飞书通知发送中'}[status]||'飞书通知状态待确认';
}
function taskCreationNotice(task){
  var status=task&&task.notification&&task.notification.status;
  return {sent:'任务已创建，飞书通知已送达',failed:'任务已创建，飞书通知暂未送达',unavailable:'任务已创建，请先同步该员工的飞书身份',pending:'任务已创建，飞书通知正在发送'}[status]||'任务已创建，飞书通知正在发送';
}
function retryNotificationNotice(notification){
  var status=notification&&notification.status;
  return {sent:'飞书通知已送达',failed:'飞书通知暂未送达',unavailable:'请先同步该员工的飞书身份',pending:'飞书通知正在发送'}[status]||'飞书通知暂未送达';
}
function mergeTaskNotification(taskId,notification){
  var safe=notification&&typeof notification==='object'?notification:{status:'failed',errorCode:'send_failed'};
  for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id===taskId){ S.tasks[i].notification=safe; break; }
  return safe;
}
function retryTaskNotification(){
  if(S.notificationRetryBusy||!hasWorkstationPermission('task.manage')) return;
  var task=S.tasks.filter(function(row){ return row.id===S.sel.task; })[0];
  var status=task&&task.notification&&task.notification.status;
  if(!task||(status!=='failed'&&status!=='unavailable')) return;
  S.notificationRetryBusy=true; render();
  Promise.resolve().then(function(){ return WORKSTATION_GATEWAY.retryTaskNotification(task.id); }).then(function(notification){
    var safe=mergeTaskNotification(task.id,notification);
    S.notificationRetryBusy=false; render(); toast(retryNotificationNotice(safe));
  }).catch(function(){
    var safe=mergeTaskNotification(task.id,{status:'failed',errorCode:'send_failed'});
    S.notificationRetryBusy=false; render(); toast(retryNotificationNotice(safe));
  });
}

function defaultPayrollPolicyDraft(){
  var d=new Date();
  return {effectiveMonth:d.getFullYear()+'-'+pad(d.getMonth()+1),pensionEmployeeRate:'8',
    medicalEmployeeRate:'2',medicalEmployeeFixedAmount:'0.00',unemploymentEmployeeRate:'0.5',
    housingFundEmployeeRate:'7',socialBaseMin:'0.00',socialBaseMax:'999999.00',
    housingBaseMin:'0.00',housingBaseMax:'999999.00'};
}
function payrollPolicyRecord(data){
  var rows=data&&Array.isArray(data.history)?data.history:[];
  return rows.filter(function(row){ return row.status==='draft'; })[0]||(data&&data.active)||null;
}
function applyPayrollPolicyState(data){
  S.payrollPolicy=data||{active:null,history:[]};
  S.payrollPolicyDraft=Object.assign(defaultPayrollPolicyDraft(),payrollPolicyRecord(data)||{});
  S.payrollPolicyExample=data&&data.draftExample||null;
  S.payrollPolicyLoaded=true; S.payrollPolicyBusy=false; S.payrollPolicyConfirmed=false;
}
function ensurePayrollPolicy(){
  if(isDemoRuntime()||!hasWorkstationPermission('salary.manage')||S.payrollPolicyLoaded||S.payrollPolicyBusy) return;
  S.payrollPolicyBusy=true;
  Promise.resolve(WORKSTATION_GATEWAY.loadPayrollPolicy()).then(function(data){
    applyPayrollPolicyState(data); render();
  }).catch(function(){
    S.payrollPolicyBusy=false; S.payrollPolicyLoaded=true; S.payrollError='薪资参数读取失败，请稍后重试'; render();
  });
}
function payrollPolicyInput(id){ var node=el(id); return node?String(node.value||'').trim():''; }
function readPayrollPolicyDraft(action){
  return {action:action,effectiveMonth:payrollPolicyInput('policyEffectiveMonth'),
    pensionEmployeeRate:payrollPolicyInput('policyPensionRate'),medicalEmployeeRate:payrollPolicyInput('policyMedicalRate'),
    medicalEmployeeFixedAmount:payrollPolicyInput('policyMedicalFixed'),unemploymentEmployeeRate:payrollPolicyInput('policyUnemploymentRate'),
    housingFundEmployeeRate:payrollPolicyInput('policyHousingRate'),socialBaseMin:payrollPolicyInput('policySocialMin'),
    socialBaseMax:payrollPolicyInput('policySocialMax'),housingBaseMin:payrollPolicyInput('policyHousingMin'),
    housingBaseMax:payrollPolicyInput('policyHousingMax'),exampleConfirmationHash:action==='activate'&&S.payrollPolicyExample?S.payrollPolicyExample.confirmationHash:null};
}
function payrollPolicyError(error){
  var code=error&&error.message||'';
  if(code==='activation_example_mismatch') return '示例结果已经变化，请重新保存草稿并核对';
  if(code==='invalid_rate'||code==='invalid_base_range') return '请检查个人比例和缴费基数范围';
  if(code==='forbidden') return '当前账号没有薪资参数管理权限';
  return '薪资参数服务暂时不可用，请稍后重试';
}
function savePayrollPolicy(action){
  if(S.payrollPolicyBusy) return;
  if(action==='activate'&&(!S.payrollPolicyConfirmed||!S.payrollPolicyExample)){ toast('请先核对并确认示例结果'); return; }
  var input=readPayrollPolicyDraft(action); S.payrollPolicyDraft=Object.assign({},input);
  S.payrollPolicyBusy=true; S.payrollError=''; render();
  Promise.resolve(WORKSTATION_GATEWAY.savePayrollPolicy(input)).then(function(response){
    S.payrollPolicyBusy=false;
    if(action==='activate'){
      S.payrollPolicyLoaded=false; ensurePayrollPolicy();
      toast('薪资核算参数已启用');
      return;
    }
    if(response&&response.draftExample){
      S.payrollPolicyExample=response.draftExample; S.payrollPolicyConfirmed=false;
      S.payrollError=''; render(); toast('草稿已保存，请核对示例结果后启用');
      return;
    }
    S.payrollPolicyLoaded=false; ensurePayrollPolicy();
    toast('薪资核算参数草稿已保存');
  }).catch(function(error){ S.payrollPolicyBusy=false; S.payrollError=payrollPolicyError(error); render(); });
}

function rebuildLookups(){

  Object.keys(PB).forEach(function(key){ delete PB[key]; });

function replaceArray(target,rows){
  target.length=0;
  rows.forEach(function(row){ target.push(cloneGatewayValue(row)); });
}
function storedArray(snapshot,key,fallback){
  if(snapshot&&Object.prototype.hasOwnProperty.call(snapshot,key)&&Array.isArray(snapshot[key])) return cloneGatewayValue(snapshot[key]);
  return cloneGatewayValue(fallback);
}
function storedMap(snapshot,key,fallback){
  var value=snapshot&&Object.prototype.hasOwnProperty.call(snapshot,key)?snapshot[key]:null;
  if(value&&typeof value==='object'&&!Array.isArray(value)) return cloneGatewayValue(value);
  return cloneGatewayValue(fallback);

function hydrateServerBootstrap(bootstrap){
  if(!bootstrap||!bootstrap.session||!bootstrap.session.memberId) throw new Error('invalid_server_bootstrap');
  replaceArray(MEMBERS,Array.isArray(bootstrap.members)?bootstrap.members:[]);
  replaceArray(PROJECTS,Array.isArray(bootstrap.projects)?bootstrap.projects:[]);
  replaceArray(KB,Array.isArray(bootstrap.kb)?bootstrap.kb:[]);
  replaceArray(DEPTS,Array.isArray(bootstrap.depts)?bootstrap.depts:[]);
  rebuildLookups();
  S.me=bootstrap.session.memberId;
  S.tasks=(Array.isArray(bootstrap.tasks)?cloneGatewayValue(bootstrap.tasks):[]).map(normalizeTask);
  S.customers=Array.isArray(bootstrap.customers)?cloneGatewayValue(bootstrap.customers):[];
  S.activities=Array.isArray(bootstrap.activities)?cloneGatewayValue(bootstrap.activities):[];
  S.decisions=Array.isArray(bootstrap.decisions)?cloneGatewayValue(bootstrap.decisions):[];
  S.agents=Array.isArray(bootstrap.agents)?cloneGatewayValue(bootstrap.agents):[];
  S.moduleErrors={};
  if(bootstrap.moduleErrors&&typeof bootstrap.moduleErrors==='object'){
    Object.keys(bootstrap.moduleErrors).forEach(function(module){
      var error=bootstrap.moduleErrors[module];
      if(error&&typeof error==='object'&&error.code==='workstation_module_unavailable'&&typeof error.requestId==='string'){
        S.moduleErrors[module]={code:error.code,requestId:error.requestId};
      }
    });
  }
  S.agentModuleError=S.moduleErrors.agents?S.moduleErrors.agents.requestId:'';
  S.runs=Array.isArray(bootstrap.runs)?cloneGatewayValue(bootstrap.runs):[];
  S.reqs=Array.isArray(bootstrap.reqs)?cloneGatewayValue(bootstrap.reqs):[];
  S.payroll=bootstrap.payroll&&typeof bootstrap.payroll==='object'?cloneGatewayValue(bootstrap.payroll):{};
  S.appr=Array.isArray(bootstrap.appr)?cloneGatewayValue(bootstrap.appr):[];
  resetRuntimeUiState('me'); S.demoCleared=false; S.serviceError=''; normalize();
}

/* ---------------- 职级与权限模型 ---------------- */
var LEVELS=[{v:1,l:'L1 员工'},{v:2,l:'L2 主管'},{v:3,l:'L3 经理'},{v:4,l:'L4 总监'},{v:5,l:'L5 决策层'}];
function lvName(v){ var level=Math.max(1,Math.min(20,parseInt(v,10)||1)),x=LEVELS.filter(function(l){ return l.v===level; })[0]; return x?x.l:'L'+level; }
function isAdmin(mid){ var m=MB[mid||S.me]; return isWorkstationCEO() || (!!m && (m.r==='企业决策人' || (m.lv||1)>=4)); }
function canUse(a,mid){
  if(!isDemoRuntime()){
    if(mid&&mid!==S.me) return {ok:0,why:'仅服务端可判定其他身份权限'};
    if(a.canInvoke===true) return {ok:1,why:'服务端已授权'};
    var reason={agent_disabled:'Agent 已停用',agent_not_configured:'Agent 待配置',agent_forbidden:'当前身份未获调用授权'}[a.denialReason]||'当前 Agent 不可调用';
    return {ok:0,why:reason};
  }
  var m=MB[mid||S.me];
  if(!m) return {ok:0,why:'身份无效'};
  if(m.r==='企业决策人') return {ok:1,why:'决策层可调用全部 Agent'};
  if((a.grant||[]).indexOf(m.id)>=0) return {ok:1,why:'已单独授权'};
  if((m.lv||1)<(a.minLv||1)) return {ok:0,why:'职级不足，需 '+lvName(a.minLv)+' 及以上',fix:'lv'};
  if(a.scope==='all') return {ok:1,why:'全公司开放'};
  if(a.scope==='dept') return m.dept===a.dept?{ok:1,why:'本部门可用'}:{ok:0,why:'仅限「'+a.dept+'」使用',fix:'dept'};
  if(a.scope==='list') return (a.depts||[]).indexOf(m.dept)>=0?{ok:1,why:'在授权部门内'}:{ok:0,why:'仅限「'+(a.depts||[]).join('、')+'」使用',fix:'dept'};
  return {ok:0,why:'未开放调用'};
}
function scopeText(a){
  if(a.scope==='all') return '全公司';
  if(a.scope==='dept') return '本部门（'+a.dept+'）';
  return '指定部门（'+((a.depts||[]).join('、')||'未指定')+'）';
}
function usableCount(a){ return MEMBERS.filter(function(m){ return canUse(a,m.id).ok; }).length; }
function normalize(){
  var lvByRole={'企业决策人':5,'架构师':4,'项目经理':3,'产品经理':3,'算法工程师':3};
  MEMBERS.forEach(function(m){ if(!m.lv) m.lv=lvByRole[m.r]||2; if(DEPTS.indexOf(m.dept)<0) DEPTS.push(m.dept); });
  S.agents.forEach(function(a){
    if(!a.scope) a.scope='all';
    if(!a.minLv) a.minLv=1;
    if(!a.grant) a.grant=[];
    if(!a.depts) a.depts=[a.dept];
  });
}

        '<span class="tag t-b">按部门 + 职级管控</span></div>',
        '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px">',
          groups.map(function(g){ return '<div style="padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line2)"><b style="font-size:12.5px">'+esc(g[0])+'</b><p class="hint" style="margin:5px 0 0">'+esc(g[1])+'</p></div>'; }).join(''),

          return '<button class="fchip" data-act="chain-add" data-id="'+attr(a.id)+'">'+esc(a.n)+'</button>'; }).join('')||'<span class="hint">当前身份没有可调用的 Agent</span>',
      '</div>',

      '<textarea class="ta" data-f="chainIn" id="chainIn" placeholder="输入交给第一个 Agent 的内容">',esc(S.chainIn||''),'</textarea>',

        ic('bolt',15), S.chainBusy?('正在执行第 '+(S.chainStep+1)+' / '+chain.length+' 步…'):'运行整条流水线','</button></div>',
      '<div><b style="font-size:14px">执行结果</b>',
      S.chainOut&&S.chainOut.length? S.chainOut.map(function(o,i){
        return '<div class="card" style="box-shadow:none;margin-top:10px"><div class="bd">'+
          '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><span class="tag t-b">步骤 '+(i+1)+'</span><b style="font-size:12.5px">'+esc(o.n)+'</b>'+
          '<span style="flex:1"></span><span class="tag t-g">'+o.ms+' ms</span></div>'+

      '</div></div></div>']);

  if(tab==='perm'){
    return head+j(['<div class="bd" style="padding-top:14px">',
    '<b style="font-size:14px">权限申请</b>',
    pend.length? '<div style="margin-top:10px">'+pend.map(function(r,i){
        var a=S.agents.filter(function(x){ return x.id===r.a; })[0], m=MB[r.m];

        return '<div style="display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px">'+
          av(m.n)+'<div style="flex:1"><b style="font-size:12.5px">'+esc(m.n)+'</b> <span style="font-size:11.5px;color:var(--mut)">'+esc(m.dept)+' · '+lvName(m.lv)+'</span>'+
          '<div style="font-size:12px;color:var(--sub);margin-top:2px">申请调用「'+esc(a.n)+'」— '+esc(canUse(a,m.id).why)+'</div></div>'+
          '<span style="font-size:11px;color:var(--mut)">'+r.at+'</span>'+
          '<button class="tag t-g" style="cursor:pointer" data-act="req-ok" data-id="'+attr(r.id)+'" data-v="one">单独授权</button>'+
          '<button class="tag t-b" style="cursor:pointer" data-act="req-ok" data-id="'+attr(r.id)+'" data-v="dept">开放给该部门</button>'+
          '<button class="tag t-r" style="cursor:pointer" data-act="req-no" data-id="'+attr(r.id)+'">驳回</button></div>';

    '<b style="font-size:14px;display:block;margin-top:20px">Agent 调用范围</b>',
    '<p class="hint" style="margin-bottom:10px">修改后立即生效。企业决策人不受任何限制。</p>',
    '<table><thead><tr><th>Agent</th><th>归属部门</th><th style="width:150px">可见范围</th><th style="width:130px">最低职级</th><th>额外授权</th><th>可调用人数</th></tr></thead><tbody>',
      S.agents.map(function(a){
        return '<tr><td><div style="display:flex;align-items:center;gap:9px">'+agentIcon(a,26)+'<b style="font-weight:600">'+esc(a.n)+'</b></div></td>'+
          '<td><span class="tag t-n">'+esc(a.dept)+'</span></td>'+
          '<td><select class="sel" style="padding:5px 8px;font-size:12px" data-perm="'+attr(a.id+':scope')+'">'+
            [['all','全公司'],['dept','仅本部门'],['list','指定部门']].map(function(o){
              return '<option value="'+o[0]+'"'+(a.scope===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select>'+
            (a.scope==='list'?'<div class="chips" style="margin-top:6px">'+DEPTS.map(function(d){
              return '<button class="fchip'+((a.depts||[]).indexOf(d)>=0?' on':'')+'" style="font-size:11px;padding:3px 8px" data-act="perm-dept" data-id="'+attr(a.id)+'" data-v="'+attr(d)+'">'+esc(d)+'</button>'; }).join('')+'</div>':'')+'</td>'+
          '<td><select class="sel" style="padding:5px 8px;font-size:12px" data-perm="'+attr(a.id+':minLv')+'">'+
            LEVELS.map(function(l){ return '<option value="'+l.v+'"'+((a.minLv||1)===l.v?' selected':'')+'>'+l.l+'</option>'; }).join('')+'</select></td>'+
          '<td>'+((a.grant||[]).length? a.grant.map(function(id){

            : '<span style="color:var(--mut);font-size:12px">无</span>')+'</td>'+
          '<td><b>'+usableCount(a)+'</b> <span style="color:var(--mut);font-size:12px">/ '+MEMBERS.length+'</span></td></tr>';
      }).join(''),
    '</tbody></table></div></div>']);
  }

  return head+j(['<div class="bd" style="padding-top:6px">',
    S.runs.length? '<table><thead><tr><th>时间</th><th>Agent</th><th>部门</th><th>调用人</th><th>状态</th><th>耗时</th><th>输出摘要</th></tr></thead><tbody>'+
      S.runs.map(function(r){
        return '<tr><td style="color:var(--sub)">'+r.at+'</td><td><b>'+esc(r.n)+'</b></td><td style="color:var(--sub)">'+esc(r.dept)+'</td>'+
          '<td>'+esc(r.by||'—')+'</td>'+
          '<td>'+invocationStatusBadge(r)+'</td><td>'+r.ms+' ms</td>'+
          '<td style="color:var(--sub);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.out.slice(0,60))+'</td></tr>';
      }).join('')+'</tbody></table>'
    : '<div class="empty">还没有运行记录。到 Agent 目录里调用一次试试。</div>',
  '</div></div>']);
}

/* ---------------- Agent 运行 ---------------- */
function logRun(a,ok,ms,out){
  var d=new Date();
  S.runs.unshift({id:a.id,n:a.n,dept:a.dept,by:(MB[S.me]||{}).n||'',at:fmt(today())+' '+pad(d.getHours())+':'+pad(d.getMinutes()),ok:ok?1:0,ms:ms,out:out});
  if(S.runs.length>40) S.runs.pop();
}
function runAgent(){
  var a=S.agents.filter(function(x){ return x.id===S.curAgent; })[0]; if(!a) return;
  var perm=canUse(a); if(!perm.ok){ toast('无调用权限：'+perm.why); return; }
  var ins={}, fields=document.querySelectorAll('#formPage [data-f]');
  a.f.forEach(function(x){
    var key='ai_'+x.k, n=null;
    Array.prototype.some.call(fields,function(field){ if(field.getAttribute('data-f')===key){ n=field; return true; } return false; });
    if(n) ins[x.k]=n.value;
  });
  S.agentIn=ins;
  if(!a.f.some(function(x){ return (ins[x.k]||'').trim(); })){ toast('请至少填写一项输入'); return; }
  S.agentBusy=true; S.agentOut=''; render();
  var t0=Date.now();
  var body=a.f.map(function(x){ return (x.l||x.n||x.k)+'：\n'+((ins[x.k]||'').trim()||'（未填写）'); }).join('\n\n');
  aiCall({model:a.model||S.cfg.model,max_tokens:1000,agent_public_id:a.id,system:a.sys,messages:[{role:'user',content:body}]})
    .then(function(d){ var t=aiText(d)||'（模型没有返回内容）'; S.agentOut=t; logRun(a,1,Date.now()-t0,t); a.runs++; })
    .catch(function(e){ S.agentOut='调用失败：'+diagnose(e); logRun(a,0,Date.now()-t0,'调用失败'); })
    .then(function(){ S.agentBusy=false; save(); render(); });
}
function runChain(){
  if(!S.chain.length){ toast('先添加至少一个节点'); return; }
  var n=el('chainIn'); if(n) S.chainIn=n.value;
  if(!(S.chainIn||'').trim()){ toast('请填写初始输入'); return; }
  S.chainBusy=true; S.chainOut=[]; S.chainStep=0; render();
  var input=S.chainIn;
  function step(i){
    if(i>=S.chain.length){ S.chainBusy=false; save(); render(); toast('流水线执行完成，共 '+S.chain.length+' 步'); return; }
    S.chainStep=i; render();
    var a=S.agents.filter(function(x){ return x.id===S.chain[i]; })[0];
    if(!a){ step(i+1); return; }
    if(!canUse(a).ok){ S.chainOut.push({n:a.n,t:'已跳过：当前身份无调用权限（'+canUse(a).why+'）',ms:0}); step(i+1); return; }
    var t0=Date.now();
    aiCall({model:a.model||S.cfg.model,max_tokens:1000,agent_public_id:a.id,system:a.sys,messages:[{role:'user',content:input}]})
      .then(function(d){ var t=aiText(d)||'（无输出）'; S.chainOut.push({n:a.n,t:t,ms:Date.now()-t0}); logRun(a,1,Date.now()-t0,t); a.runs++; input=t; })
      .catch(function(e){ S.chainOut.push({n:a.n,t:'调用失败：'+diagnose(e),ms:Date.now()-t0}); logRun(a,0,Date.now()-t0,'调用失败'); input=''; })
      .then(function(){ if(input==='') { S.chainBusy=false; render(); return; } step(i+1); });
  }
  step(0);
}
function createAgent(){
  syncForm(); var f=S.form.agent;
  if(!f.n){ toast('请填写 Agent 名称'); return; }
  if(!f.sys||f.sys.trim().length<10){ toast('系统提示词太短，它决定 Agent 的专业性'); return; }
  if(!f.fields||!f.fields.length){ toast('请至少添加一个输入字段'); return; }
  var fields=f.fields.map(function(x,i){ return {k:'f'+i,l:x.l,t:x.t,ph:''}; });
  if(S.editId){

      a.scope=f.scope;a.minLv=parseInt(f.minLv,10)||1;a.depts=(f.depts||[]).slice(); } });
    toast('Agent 已更新');

    S.agents.push({id:'ag'+Date.now().toString(36).slice(-5),n:f.n,dept:f.dept,ic:f.ic,
      d:f.d||'（未填写描述）',sys:f.sys,model:f.model,on:1,runs:0,ok:100,f:fields,

}

/* ---------------- 成员 / 项目 删除 ---------------- */
function memberReferenceLabels(id){
  var labels=[];
  function add(label){ if(labels.indexOf(label)<0) labels.push(label); }
  if(S.tasks.some(function(task){ return task.own===id||task.reviewer===id||task.createdBy===id; })) add('任务');
  if(PROJECTS.some(function(project){ return project.own===id||(Array.isArray(project.members)&&project.members.indexOf(id)>=0); })) add('项目');
  if(S.customers.some(function(customer){ return customer.own===id; })) add('客户');
  if(S.activities.some(function(activity){ return activity.own===id; })) add('活动');
  if(S.decisions.some(function(decision){ return decision.by===id; })) add('决策');
  if(S.reqs.some(function(request){ return request.m===id; })) add('权限申请');
  var payrollRows=S.payroll&&S.payroll[id];
  if(Array.isArray(payrollRows)&&payrollRows.some(function(row){ return row&&typeof row==='object'; })) add('薪酬');
  if(S.agents.some(function(agent){ return Array.isArray(agent.grant)&&agent.grant.indexOf(id)>=0; })) add('Agent 授权');
  return labels;
}
function delMember(id){
  var m=MB[id]; if(!m) return;
  if(MEMBERS.length<=1){ toast('至少保留一名成员，当前成员不能删除'); return; }
  var references=memberReferenceLabels(id);
  if(references.length){ toast('无法删除 '+m.n+'：仍被'+references.join('、')+'引用，请先解除关联'); return; }
  ask('删除成员 '+m.n+'？','该成员没有业务关联，可以安全删除。','确认删除', function(){
      var i=MEMBERS.map(function(x){ return x.id; }).indexOf(id);
      if(i>=0) MEMBERS.splice(i,1);
      delete MB[id];
      delete S.payroll[id];
      if(S.me===id&&MEMBERS.length) S.me=MEMBERS[MEMBERS.length-1].id;
      save(); S.confirm=null; render();
      toast('已删除 '+m.n);
    }, true);
}
function delProject(id){

function profileSkills(value){
  var rows=String(value||'').split(/[\n,;\uFF0C\u3001\uFF1B]+/).map(function(item){ return item.trim(); }).filter(Boolean), skills=[];
  for(var i=0;i<rows.length;i++){
    var match=rows[i].match(/^(.+?)(?:\s*[:\uFF1A=]\s*|\s+)(?:L|l|\u7B49\u7EA7)?\s*([1-5])\s*(?:\u7EA7|\u5206|\u661F|\/5)?$/);
    if(!match) return null;
    var name=match[1].trim(), level=parseInt(match[2],10);
    if(!name||name.length>40||!Number.isInteger(level)||level<1||level>5) return null;
    skills.push({name:name,level:level});
  }
  return skills;
}

function issue(){
  var sc=S.sch, pl=sc.plans&&sc.plans.filter(function(p){ return p.k===sc.pick; })[0];
  if(!pl||!sc.tasks){ toast('请先生成并选择调度方案'); return; }
  var projectId=sc.projectId||(isDemoRuntime()?'p1':'');
  if(!projectId){ toast('请先选择任务所属项目'); return; }
  var base=today(), n=0;
  if(!isDemoRuntime()){
    if(sc.issuing) return;
    var inputs=sc.tasks.map(function(t){
      var m=pl.map[t.id]; if(!m) return null;
      return {projectId:projectId,assigneeMemberId:m.own,title:t.n,description:sc.goal,
        acceptanceCriteria:t.ac,dueDate:fmt(addD(base,m.e)),priority:t.pri};
    }).filter(Boolean);
    if(!inputs.length){ toast('当前方案没有可下发的任务'); return; }
    sc.issuing=true; render();
    Promise.resolve().then(function(){ return WORKSTATION_GATEWAY.createTasks(inputs); }).then(function(tasks){
      tasks.forEach(function(task){
        if(task&&task.id&&!S.tasks.some(function(row){ return row.id===task.id; })) S.tasks.unshift(normalizeTask(task));
      });
      var sent=tasks.filter(function(task){ return task&&task.notification&&task.notification.status==='sent'; }).length;
      sc.issuing=false; sc.issued=true; S.page='task'; render();
      toast('已创建 '+tasks.length+' 项任务，飞书送达 '+sent+' 项，未送达 '+(tasks.length-sent)+' 项');
    }).catch(function(error){
      sc.issuing=false; render(); toast(taskError(error));
    });
    return;
  }
  sc.tasks.forEach(function(t){
    var m=pl.map[t.id]; if(!m) return;
    S.tasks.unshift(normalizeTask({ id:'T'+Math.floor(Math.random()*9000+1000), n:t.n, p:projectId, own:m.own, role:t.role,
      pri:t.pri, st:'待处理', s:fmt(addD(base,m.s)), e:fmt(addD(base,m.e)), src:'AI调度', dep:[], ac:t.ac,
      createdBy:S.me, reviewer:S.me, description:t.n,
      timeline:[{actor:S.me,action:'下发任务',note:'AI 调度',at:stamp()}] }));
    n++;
  });
  sc.issued=true; save();
  toast('已下发 '+n+' 项任务，并同步到 '+pl.heads+' 位成员的工作台');
  S.page='task'; render();
}
function genPlan(){
