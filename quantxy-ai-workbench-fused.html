  S.sch.budget=bd?(parseFloat(bd.value)||30):30; S.sch.must=ms?ms.value.trim():''; S.sch.projectId=pj?pj.value:S.sch.projectId;
  if(!S.sch.goal){ toast('请先填写战略目标'); return; }

/* 文件选择 / 拖拽 */
document.addEventListener('click',function(e){
  var dz=e.target.closest?e.target.closest('#dropZone'):null;
  if(dz&&e.target.id!=='fileIn'){ var fi=el('fileIn'); if(fi) fi.click(); }
});
function takeFiles(list){
  syncForm();
  Array.prototype.forEach.call(list,function(f){ S.form.file.files.push({n:f.name,s:f.size}); });
  if(!S.form.file.n&&S.form.file.files.length) S.form.file.n=S.form.file.files[0].n.replace(/\.[^.]+$/,'');
  render();
}
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='fileIn'&&e.target.files&&e.target.files.length) takeFiles(e.target.files);
});
document.addEventListener('dragover',function(e){
  var dz=e.target.closest?e.target.closest('#dropZone'):null; if(!dz) return;
  e.preventDefault(); dz.classList.add('on');
});
document.addEventListener('dragleave',function(e){
  var dz=e.target.closest?e.target.closest('#dropZone'):null; if(dz) dz.classList.remove('on');
});
document.addEventListener('drop',function(e){
  var dz=e.target.closest?e.target.closest('#dropZone'):null; if(!dz) return;
  e.preventDefault(); dz.classList.remove('on');
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length) takeFiles(e.dataTransfer.files);
});
/* 筛选与搜索输入 */
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='chatIn'){
    S.chatDraft=e.target.value;
    persistUiState();
    return;
  }
  var lk=e.target.getAttribute&&e.target.getAttribute('data-login');
  if(lk==='user'||lk==='pass'){
    LOGIN[lk]=e.target.value;
    return;
  }
  var q=e.target.getAttribute&&e.target.getAttribute('data-q'); if(!q) return;
  S.f[q]=e.target.value;
  if(q==='gq'&&S.f.gq.trim()&&S.page!=='search') S.page='search';
  persistUiState();
  reRenderKeepFocus();
});

  var loginKey=e.target.getAttribute&&e.target.getAttribute('data-login');
  if(loginKey==='remember'){ LOGIN.remember=!!e.target.checked; return; }

    if(e.target.getAttribute&&e.target.getAttribute('data-f')==='salaryMember'){
      S.payrollDraft=applyDepartmentLevelSalaryDraft(readFormalPayrollDraft(),true);
      S.payrollPreview=null; S.payrollPreviewHash=''; S.payrollError=''; persistUiState(); render(); return;
    }
    if(e.target.id==='salaryMonth'){
      S.payrollDraft=applyDepartmentLevelSalaryDraft(readFormalPayrollDraft(),false);
      S.payrollPreview=null; S.payrollPreviewHash=''; S.payrollError=''; persistUiState(); render(); return;
    }
    S.payrollPreview=null; S.payrollPreviewHash='';
    var salaryDraftButton=document.querySelector('[data-act="payroll-save-draft"]'); if(salaryDraftButton) salaryDraftButton.disabled=true;
    var salaryConfirmButton=document.querySelector('[data-act="payroll-confirm"]'); if(salaryConfirmButton) salaryConfirmButton.disabled=true;
  }
  if(e.target.id==='schProject'){ S.sch.projectId=e.target.value; persistUiState(); return; }
  var assignment=e.target.getAttribute&&e.target.getAttribute('data-act')==='assign-member'?e.target:null;
  if(assignment){
    if(assignScheduleMember(assignment.getAttribute('data-task-id'),assignment.value)){
      persistUiState(); render(); toast('已人工调整执行人，AI 推荐记录已保留');
    }else toast('人员调整失败，请重新生成方案');
    return;
  }
  var pm=e.target.getAttribute&&e.target.getAttribute('data-perm');
  var lm=e.target.getAttribute&&e.target.getAttribute('data-lv');
  var dm=e.target.getAttribute&&e.target.getAttribute('data-dept');
  if(!isDemoRuntime()&&(pm||lm||dm)){ render(); toast('真实数据写接口未配置'); return; }
  var q=e.target.getAttribute&&e.target.getAttribute('data-q');
  if(q&&e.target.tagName==='SELECT'){ S.f[q]=e.target.value; persistUiState(); render(); return; }
  if(pm){ var ps=pm.split(':'), ag=S.agents.filter(function(x){ return x.id===ps[0]; })[0];
    if(ag){ if(ps[1]==='minLv') ag.minLv=parseInt(e.target.value,10)||1;
      else { ag.scope=e.target.value; if(ag.scope==='list'&&!(ag.depts||[]).length) ag.depts=[ag.dept]; }
      save(); render(); } return; }
  if(lm&&MB[lm]){ MB[lm].lv=parseInt(e.target.value,10)||1; save(); render(); toast(MB[lm].n+' 职级调整为 '+lvName(MB[lm].lv)); return; }
  if(dm&&MB[dm]){ MB[dm].dept=e.target.value; save(); render(); toast(MB[dm].n+' 已调整到 '+e.target.value); }
});
/* 表单实时预览（只更新预览节点，不打断输入焦点） */
document.addEventListener('input',function(e){
  if(e.target&&/^policy/.test(e.target.id||'')&&e.target.id!=='policyExampleConfirmed'){
    S.payrollPolicyConfirmed=false; S.payrollPolicyExample=null;
    var activate=document.querySelector('[data-act="payroll-policy-activate"]'); if(activate) activate.disabled=true;
    return;
  }
  if(e.target&&(/^salary/.test(e.target.id||'')||e.target.getAttribute&&e.target.getAttribute('data-f')==='salaryMember')){
    S.payrollPreview=null; S.payrollPreviewHash='';
    var draftButton=document.querySelector('[data-act="payroll-save-draft"]'); if(draftButton) draftButton.disabled=true;
    var confirmButton=document.querySelector('[data-act="payroll-confirm"]'); if(confirmButton) confirmButton.disabled=true;
    return;
  }
  if(S.page.indexOf('new-')!==0) return;
  if(!e.target.getAttribute||!e.target.getAttribute('data-f')) return;
  syncForm(); persistUiState(); var n=el('fpv'); if(n&&PREV[S.page]) n.innerHTML=PREV[S.page]();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.mobileNav){
    e.preventDefault(); S.mobileNav=false; renderNav();
    var moreControl=el('nav')&&el('nav').querySelector('[data-act="mobile-nav-more"]');
    if(moreControl) moreControl.focus();
    return;
  }
  if(e.key==='Enter'&&e.target&&e.target.getAttribute&&e.target.getAttribute('data-login')){ e.preventDefault(); submitLogin(); return; }
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&document.activeElement&&document.activeElement.id==='chatIn'){ e.preventDefault(); sendChat(); }
});
var MOBILE_SHELL_MEDIA=window.matchMedia?window.matchMedia('(max-width:820px)'):null;
var MOBILE_SHELL_ACTIVE=isMobileShell();
function syncMobileShell(){
  var mobileShell=isMobileShell();
  if(mobileShell===MOBILE_SHELL_ACTIVE) return;
  MOBILE_SHELL_ACTIVE=mobileShell; S.mobileNav=false;
  if(!mobileShell) S.mobileTaskFocus=false;
  else if(S.page==='task'){ S.page='me'; S.mobileTaskFocus=true; }
  render();
}
if(MOBILE_SHELL_MEDIA){
  if(MOBILE_SHELL_MEDIA.addEventListener) MOBILE_SHELL_MEDIA.addEventListener('change',syncMobileShell);
  else if(MOBILE_SHELL_MEDIA.addListener) MOBILE_SHELL_MEDIA.addListener(syncMobileShell);
}
window.addEventListener('resize',syncMobileShell);

/* ---------------- 启动 ---------------- */
function redirectFormalLogin(){
  var adapter=window.QUANTXY_WORKSTATION_SERVER_ADAPTER;
  if(adapter&&typeof adapter.redirectToLogin==='function'){ adapter.redirectToLogin(); return; }
  window.location.assign('/login?next='+encodeURIComponent(window.location.pathname+window.location.search));
}
function startWorkstation(){
  var demoClearedAtStartup=false, startupNotice='';
  var saved=null, legacyAiSecret=false, migratedLegacy=false, legacyDataPresent=false;
  if(!isDemoRuntime()){
    emptyDemoBusinessData(); S.demoCleared=false;
    if(WORKSTATION_GATEWAY.serviceUnavailable){ S.serviceError={code:'workstation_unavailable',requestId:''}; }
    else{
      try{ hydrateServerBootstrap(WORKSTATION_GATEWAY.loadBootstrap()); startupNotice=applyTaskDeepLink(); }
      catch(e){ S.serviceError=safeServiceFailure(e); }
    }
  }else{
    try{ demoClearedAtStartup=localStorage.getItem(QXY_DEMO_CLEARED_KEY)==='1'; }catch(e){}
    saved=demoClearedAtStartup?null:load(); migratedLegacy=LOADED_DATA_SOURCE==='legacy';
    try{ legacyDataPresent=localStorage.getItem(QXY_LEGACY_DATA_KEY)!=null; }catch(e){}
    if(demoClearedAtStartup){
      emptyDemoBusinessData();
    }else{
      if(saved&&saved.cfg){
        ['apiKey','proxy','keyCleared'].forEach(function(k){
          if(Object.prototype.hasOwnProperty.call(saved.cfg,k)){ delete saved.cfg[k]; legacyAiSecret=true; }
        });
        ['workday','parallel','riskLine'].forEach(function(k){ if(saved.cfg[k]!=null) S.cfg[k]=saved.cfg[k]; });
      }
      S.cfg.provider='deepseek'; S.cfg.endpoint='/api/ai/chat';
      replaceArray(MEMBERS,storedArray(saved,'members',INITIAL_MEMBERS));
      replaceArray(PROJECTS,storedArray(saved,'projects',INITIAL_PROJECTS));
      replaceArray(KB,storedArray(saved,'kb',INITIAL_KB));
      replaceArray(DEPTS,storedArray(saved,'depts',INITIAL_DEPTS));
      rebuildLookups();
      S.tasks=storedArray(saved,'tasks',seedTasks()).map(normalizeTask);
      S.customers=storedArray(saved,'customers',seedCustomers());
      S.activities=storedArray(saved,'activities',seedActivities());
      S.decisions=storedArray(saved,'decisions',seedDecisions());
      S.payroll=storedMap(saved,'payroll',seedPayroll());
      S.agents=storedArray(saved,'agents',seedAgents());
      S.runs=storedArray(saved,'runs',[]);
      S.reqs=storedArray(saved,'reqs',[]);
      normalize();
      var safeV2Ready=LOADED_DATA_SOURCE==='v2'&&!legacyAiSecret;
      if(legacyAiSecret||migratedLegacy) safeV2Ready=save();
      if(legacyDataPresent&&safeV2Ready){ try{ localStorage.removeItem(QXY_LEGACY_DATA_KEY); }catch(e){} }
      S.appr=seedAppr();
    }
  }
  S.form=blankForm();
  restoreUiState();
  renderBrand();
  bootstrapDemoSession();
  if(startupNotice) setTimeout(function(){ toast(startupNotice); },0);
}
if(!isDemoRuntime()&&window.QUANTXY_WORKSTATION_SERVER_ADAPTER&&typeof window.QUANTXY_WORKSTATION_SERVER_ADAPTER.ready==='function'){
  window.QUANTXY_WORKSTATION_SERVER_ADAPTER.ready().then(startWorkstation).catch(function(e){
    if(window.QUANTXY_WORKSTATION_AUTH_REQUIRED||String(e&&e.message)==='unauthorized'){ redirectFormalLogin(); return; }
    emptyDemoBusinessData(); S.serviceError=safeServiceFailure(e); S.form=blankForm(); renderBrand(); render();
  });
}else startWorkstation();
return {S:S, render:render, schedule:schedule, makePlans:makePlans,gateway:WORKSTATION_GATEWAY,runtime:WORKSTATION_RUNTIME};
})();
</script>
